<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Higher Ground</title>
<style>
  :root {
    --bg: #0b1020; --panel: rgba(16, 22, 42, .86); --line: rgba(255, 255, 255, .12);
    --text: #eef1ff; --muted: #9aa3c4; --p0: #3fa9ff; --p1: #ff5a4f; --gold: #e8c25a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: absolute; left: 0; right: 0; top: 64px; bottom: 196px; width: 100%; height: calc(100% - 260px); display: block; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; }

  #top { position: absolute; top: 0; left: 0; right: 0; height: 64px; display: grid;
    grid-template-columns: 1fr minmax(150px, 260px) 1fr; gap: 8px; padding: 6px 10px; background: var(--panel);
    border-bottom: 1px solid var(--line); }
  .pinfo { border-radius: 10px; padding: 4px 10px; border: 2px solid transparent; min-width: 0; overflow: hidden; }
  .pinfo .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pinfo .st { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #p0info { border-color: rgba(63, 169, 255, .25); } #p0info .nm { color: var(--p0); }
  #p1info { border-color: rgba(255, 90, 79, .25); text-align: right; } #p1info .nm { color: var(--p1); }
  .pinfo.active { box-shadow: 0 0 0 1px currentColor inset; background: rgba(255, 255, 255, .05); }
  #p0info.active { border-color: var(--p0); } #p1info.active { border-color: var(--p1); }
  #center { text-align: center; }
  #timer { font-weight: 800; font-size: 20px; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  #timer.low { color: var(--p1); }
  #dombar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #333a4d; margin: 2px 0; }
  #dom0 { background: var(--p0); } #domN { background: #3a4155; flex: 1; } #dom1 { background: var(--p1); }
  #turnlbl { font-size: 11px; color: var(--muted); }

  #msg { position: absolute; top: 72px; left: 50%; transform: translateX(-50%); max-width: min(92vw, 560px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; text-align: center;
    pointer-events: none; }
  #peek { position: absolute; top: 112px; left: 50%; transform: translateX(-50%); color: var(--gold); font-weight: 700;
    pointer-events: none; text-shadow: 0 1px 4px #000; }

  #bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 196px; background: var(--panel);
    border-top: 1px solid var(--line); padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
  #controls { display: flex; gap: 8px; align-items: stretch; justify-content: center; }
  #controls button { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 800; font-size: 16px; min-width: 96px; }
  #bLower { background: #2a3350; } #bHigher { background: #2a3350; }
  #bLower:not(:disabled):hover, #bHigher:not(:disabled):hover { background: #3a4670; }
  #bCash { background: linear-gradient(#f2d06e, #c99a2c); color: #2a1b00; }
  #bCancel { background: #533; display: none; }
  #controls button:disabled { opacity: .35; cursor: default; }
  #tokens { align-self: center; color: var(--gold); font-weight: 800; min-width: 70px; text-align: center; }
  #hand { flex: 1; display: flex; gap: 8px; overflow-x: auto; justify-content: center; padding-bottom: 2px; }
  .hcard { flex: 0 0 116px; border: 2px solid var(--gold); border-radius: 10px; padding: 6px; text-align: center;
    background: linear-gradient(#2a1650, #120a2a); display: flex; flex-direction: column; gap: 2px; transition: transform .15s; }
  .hcard:not(:disabled):hover { transform: translateY(-4px); }
  .hcard:disabled { opacity: .45; cursor: default; }
  .hcard .ic { font-size: 24px; line-height: 1.1; }
  .hcard b { font-size: 12px; } .hcard small { font-size: 10.5px; color: #c9c2e6; line-height: 1.2;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .hcard { overflow: hidden; }
  #controls button { white-space: nowrap; }
  .hcard.back { background: repeating-linear-gradient(45deg, #142a5c 0 8px, #1b3570 8px 16px); }
  .empty { color: var(--muted); align-self: center; text-align: center; font-size: 12px; }

  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5, 8, 18, .78); backdrop-filter: blur(4px); z-index: 10; padding: 16px; }
  #overlay.hidden { display: none; }
  .box { background: #121a33; border: 1px solid var(--line); border-radius: 18px; padding: 22px; max-width: 560px;
    width: 100%; max-height: 100%; overflow: auto; }
  .box h1 { margin: 0; font-size: 34px; letter-spacing: 2px; background: linear-gradient(90deg, var(--p0), var(--gold), var(--p1));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .box h2 { margin: 0 0 8px; }
  .box p { color: #c8cee6; } .box ul { padding-left: 18px; color: #c8cee6; } .box li { margin: 4px 0; }
  .box .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .box .btns button { flex: 1; border: 0; border-radius: 12px; padding: 12px; font-weight: 800; font-size: 15px;
    background: linear-gradient(#f2d06e, #c99a2c); color: #2a1b00; min-width: 160px; }
  .box .btns button.alt { background: #2a3350; color: var(--text); }
  #help { position: absolute; top: 72px; right: 10px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--panel); font-weight: 800; }

  #banner { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 30px; font-weight: 900;
    text-shadow: 0 2px 16px #000; pointer-events: none; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  .float { position: absolute; transform: translate(-50%, -50%); font-weight: 900; font-size: 22px; pointer-events: none;
    text-shadow: 0 2px 8px #000; white-space: nowrap; }
  #tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 4px 8px; font-size: 12px; display: none; }

  @media (max-width: 640px) {
    #top { grid-template-columns: 1fr 120px 1fr; padding: 4px 6px; }
    .pinfo { padding: 2px 6px; } #timer { font-size: 17px; }
    #controls button { padding: 10px 10px; min-width: 70px; font-size: 15px; }
    .hcard { flex-basis: 92px; padding: 4px; } .hcard .ic { font-size: 20px; } .hcard small { font-size: 9.5px; }
    #controls { gap: 6px; } #controls button { padding: 10px 8px; min-width: 0; flex: 1; font-size: 14px; }
    #tokens { min-width: 34px; font-size: 13px; }
    #msg { border-radius: 12px; font-size: 12.5px; padding: 5px 10px; top: 68px; }
    .box h1 { font-size: 28px; }
  }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <div class="pinfo" id="p0info"></div>
  <div id="center"><div id="timer">10:00</div><div id="dombar"><div id="dom0"></div><div id="domN"></div><div id="dom1"></div></div><div id="turnlbl"></div></div>
  <div class="pinfo" id="p1info"></div>
</div>
<div id="msg">Welkom bij Higher Ground</div>
<div id="peek"></div>
<button id="help" title="Regels">?</button>
<div id="bottom">
  <div id="controls">
    <button id="bLower">▼ Lager</button>
    <div id="tokens"></div>
    <button id="bHigher">▲ Hoger</button>
    <button id="bCash">Claim</button>
    <button id="bCancel">Annuleer</button>
  </div>
  <div id="hand"></div>
</div>
<div id="banner"></div>
<div id="tip"></div>
<div id="overlay"></div>

<script type="module">
import * as THREE from 'three';

// ---------- constants ----------
const $ = (id) => document.getElementById(id);
const VERSION = '0.1.0';
const COLS = 5, ROWS = 6, SP = 1.15, HAND_MAX = 5, ROUND_SECONDS = 600, DOM_WIN = 0.6;
const PCSS = ['#3fa9ff', '#ff5a4f'];
const TILE_COL = [0x1f5f99, 0x99332d], TILE_NEUTRAL = 0x3c4250;
const BLD_COL = [0x5cb8ff, 0xff7a6e], BLD_NEUTRAL = 0xd8d2c4;
const SUITS = ['♠', '♥', '♦', '♣'];
const rankLabel = (r) => ({ 11: 'J', 12: 'Q', 13: 'K', 14: 'A' })[r] || String(r);
const cardLabel = (c) => rankLabel(c.rank) + SUITS[c.suit];
const TILE_NAMES = { 1: 'Huis', 2: 'Winkel', 3: 'Toren' };

// 15 action cards hidden in the deck (Yu-Gi-Oh/Magic style: drawn into your hand, played on your turn).
const ACTIONS = {
  lucky:    { name: 'Gouden munt',    icon: '🪙', count: 2, text: 'Je volgende muntworp valt gegarandeerd op kop.' },
  peek:     { name: 'Verrekijker',    icon: '🔭', count: 2, text: 'Bekijk de volgende speelkaart voordat je raadt.' },
  double:   { name: 'Dubbel of niks', icon: '⚡', count: 2, text: 'Je volgende goede gok levert 2 claims op.' },
  second:   { name: 'Tweede kans',    icon: '🍀', count: 2, text: 'Je volgende foute gok deze beurt telt niet.' },
  shield:   { name: 'Schild',         icon: '🛡️', count: 2, target: 'own', text: 'Bescherm een eigen vakje tijdens 2 beurten van je tegenstander.' },
  equal:    { name: 'Gelijkspel',     icon: '⚖️', count: 1, text: 'Deze beurt telt een gelijke kaart als goed geraden.' },
  sabotage: { name: 'Sabotage',       icon: '💣', count: 1, text: 'De volgende muntworp van je tegenstander mislukt.' },
  quake:    { name: 'Aardbeving',     icon: '🌋', count: 1, text: 'Een willekeurig vijandelijk vakje (geen vlag) wordt weer neutraal.' },
  swap:     { name: 'Ruil',           icon: '🔄', count: 1, text: 'Vervang de open kaart door een nieuwe.' },
  takeover: { name: 'Overname',       icon: '🏗️', count: 1, target: 'claim', text: 'Claim een aangrenzend vakje zonder munt (geen vlag).' },
};

// ---------- helpers ----------
// Test hooks: ?speed=N runs the whole game N× faster, ?autoplay lets the AI play both sides.
const params = new URLSearchParams(location.search);
const SPEED = Math.max(1, Number(params.get('speed')) || 1), AUTOPLAY = params.has('autoplay');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms / SPEED));
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a) => a[Math.random() * a.length | 0];
const easeInOut = (k) => k < .5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
const tweens = [];
const tween = (dur, fn, ease = easeInOut) => new Promise((res) => tweens.push({ t: 0, dur, fn, ease, res }));
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur);
    tw.fn(tw.ease(k)); if (k >= 1) { tweens.splice(i, 1); tw.res(); }
  }
}
let actx;
function beep(f = 440, d = .08, type = 'sine', v = .05) {
  try {
    actx ??= new AudioContext();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = v;
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
  } catch { /* audio is optional */ }
}

// ---------- three.js scene ----------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
scene.fog = new THREE.Fog(0x0b1020, 24, 48);
const camera = new THREE.PerspectiveCamera(42, 1, .1, 120);
const camTarget = new THREE.Vector3(0, .4, 1.05);
const camDir = new THREE.Vector3(0, .9, .44).normalize();

scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x1a1410, .9));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.4);
sun.position.set(4, 11, 6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 });
scene.add(sun);
const rim0 = new THREE.PointLight(0x3fa9ff, 18, 12); rim0.position.set(0, 2.5, 5); scene.add(rim0);
const rim1 = new THREE.PointLight(0xff5a4f, 18, 12); rim1.position.set(0, 2.5, -5); scene.add(rim1);

const table = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x0f1d1a, roughness: .95 }));
table.rotation.x = -Math.PI / 2; table.position.y = -.32; table.receiveShadow = true; scene.add(table);
const base = new THREE.Mesh(new THREE.BoxGeometry(COLS * SP + .5, .3, ROWS * SP + .5), new THREE.MeshStandardMaterial({ color: 0x3a2a1e, roughness: .8 }));
base.position.y = -.2; base.receiveShadow = true; base.castShadow = true; scene.add(base);
{ // starfield, a nod to the Zystam cosmic brand
  const g = new THREE.BufferGeometry(), pts = [];
  for (let i = 0; i < 700; i++) { const v = new THREE.Vector3().randomDirection().multiplyScalar(30 + Math.random() * 10); if (v.y < 2) v.y = Math.abs(v.y) + 2; pts.push(v.x, v.y, v.z); }
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: .12, sizeAttenuation: true, fog: false })));
}

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = Math.max(10.2 / (2 * tan), 7.4 / (2 * tan * camera.aspect)) * 1.02;
  camera.position.copy(camTarget).addScaledVector(camDir, dist);
  camera.lookAt(camTarget); camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

// ---------- textures ----------
const texCache = new Map();
function canvasTex(key, w, h, draw) {
  if (texCache.has(key)) return texCache.get(key);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  texCache.set(key, t); return t;
}
function wrap(g, text, x, y, maxW, lh) {
  let line = '';
  for (const word of text.split(' ')) {
    const test = line ? line + ' ' + word : word;
    if (g.measureText(test).width > maxW && line) { g.fillText(line, x, y); line = word; y += lh; } else line = test;
  }
  g.fillText(line, x, y);
}
const CW = 256, CH = 358;
function faceTex(card) {
  if (card.kind === 'play') return canvasTex('p' + card.rank + card.suit, CW, CH, (g, w, h) => {
    const red = card.suit === 1 || card.suit === 2, col = red ? '#c8202f' : '#15161c';
    g.fillStyle = '#fbf8f0'; g.beginPath(); g.roundRect(4, 4, w - 8, h - 8, 22); g.fill();
    g.strokeStyle = '#d8d0bc'; g.lineWidth = 3; g.stroke();
    g.fillStyle = col; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = 'bold 52px Georgia, serif'; g.fillText(rankLabel(card.rank), 40, 46);
    g.font = '40px serif'; g.fillText(SUITS[card.suit], 40, 94);
    g.save(); g.translate(w - 40, h - 46); g.rotate(Math.PI);
    g.font = 'bold 52px Georgia, serif'; g.fillText(rankLabel(card.rank), 0, 0);
    g.font = '40px serif'; g.fillText(SUITS[card.suit], 0, -48); g.restore();
    g.font = '150px serif'; g.fillText(SUITS[card.suit], w / 2, h / 2 + 6);
  });
  const A = ACTIONS[card.id];
  return canvasTex('a' + card.id, CW, CH, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#3a1f6e'); gr.addColorStop(1, '#120a2a');
    g.fillStyle = gr; g.beginPath(); g.roundRect(4, 4, w - 8, h - 8, 22); g.fill();
    g.strokeStyle = '#e8c25a'; g.lineWidth = 7; g.stroke();
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '96px serif'; g.fillText(A.icon, w / 2, 110);
    g.fillStyle = '#f2d06e'; g.font = 'bold 26px system-ui, sans-serif'; g.fillText(A.name, w / 2, 200);
    g.fillStyle = '#ddd6f5'; g.font = '19px system-ui, sans-serif'; wrap(g, A.text, w / 2, 240, w - 40, 24);
  });
}
const backTex = () => canvasTex('back', CW, CH, (g, w, h) => {
  g.fillStyle = '#142a5c'; g.beginPath(); g.roundRect(4, 4, w - 8, h - 8, 22); g.fill();
  g.save(); g.clip(); g.strokeStyle = 'rgba(255,255,255,.08)'; g.lineWidth = 10;
  for (let i = -h; i < w + h; i += 26) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + h, h); g.stroke(); g.beginPath(); g.moveTo(i, h); g.lineTo(i + h, 0); g.stroke(); }
  g.restore(); g.strokeStyle = '#e8c25a'; g.lineWidth = 6; g.beginPath(); g.roundRect(18, 18, w - 36, h - 36, 14); g.stroke();
  g.fillStyle = '#e8c25a'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = 'bold 64px Georgia, serif'; g.fillText('HG', w / 2, h / 2);
});
const coinTex = (heads) => canvasTex(heads ? 'kop' : 'munt', 256, 256, (g, w) => {
  const gr = g.createRadialGradient(w / 2, w / 2, 20, w / 2, w / 2, w / 2);
  gr.addColorStop(0, heads ? '#ffe9a0' : '#e0e6f0'); gr.addColorStop(1, heads ? '#b88a1e' : '#7d8597');
  g.fillStyle = gr; g.fillRect(0, 0, w, w);
  g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 10; g.beginPath(); g.arc(w / 2, w / 2, w / 2 - 18, 0, Math.PI * 2); g.stroke();
  g.fillStyle = 'rgba(40,25,0,.85)'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '90px serif'; g.fillText(heads ? '♛' : '✦', w / 2, w / 2 - 16);
  g.font = 'bold 40px system-ui, sans-serif'; g.fillText(heads ? 'KOP' : 'MUNT', w / 2, w / 2 + 70);
});

// ---------- cards in 3D ----------
const CARD_W = 1.3, CARD_H = 1.82, cardGeo = new THREE.PlaneGeometry(CARD_W, CARD_H);
const pile = new THREE.Group(); pile.position.set(0, .95, 4.85); pile.rotation.x = -.95; scene.add(pile);
const DECK_X = -.95, CUR_X = .95;
function makeCard(card, showFace = true) {
  const g = new THREE.Group();
  const front = new THREE.Mesh(cardGeo, new THREE.MeshStandardMaterial({ map: showFace ? faceTex(card) : backTex(), transparent: true, alphaTest: .5, roughness: .55 }));
  const back = new THREE.Mesh(cardGeo, new THREE.MeshStandardMaterial({ map: backTex(), transparent: true, alphaTest: .5, roughness: .55 }));
  back.rotation.y = Math.PI; front.castShadow = back.castShadow = true;
  g.add(front, back); return g;
}
const deckMesh = new THREE.Mesh(new THREE.BoxGeometry(CARD_W * .97, CARD_H * .97, .3),
  [0, 0, 0, 0, 1, 0].map((f) => f ? new THREE.MeshStandardMaterial({ map: backTex() }) : new THREE.MeshStandardMaterial({ color: 0xe9e2cf })));
deckMesh.position.set(DECK_X, 0, -.15); deckMesh.castShadow = true; pile.add(deckMesh);
let curMesh = null;

async function revealCard(card) {
  const m = makeCard(card); m.position.set(DECK_X, 0, .05); m.rotation.y = Math.PI; pile.add(m);
  beep(520, .06, 'triangle');
  await tween(.5, (k) => { m.position.x = DECK_X + (CUR_X - DECK_X) * k; m.position.z = .05 + Math.sin(k * Math.PI) * .7 + k * .02; m.rotation.y = Math.PI * (1 - k); });
  if (curMesh) pile.remove(curMesh);
  curMesh = m;
}
async function showActionDraw(card, pi) {
  const human = !S.players[pi].ai;
  const m = makeCard(card, human); m.position.set(DECK_X, 0, .05); m.rotation.y = Math.PI; pile.add(m);
  beep(880, .12, 'sine', .06); beep(1320, .18, 'sine', .04);
  await tween(.45, (k) => { m.position.set(DECK_X * (1 - k), 0, .05 + k * 1.4); m.rotation.y = Math.PI * (1 - k); m.scale.setScalar(1 + k * .25); });
  await sleep(human ? 700 : 350);
  const dy = pi === 0 ? -3 : 4;
  await tween(.35, (k) => { m.position.y = dy * k; m.scale.setScalar(1.25 - k); });
  pile.remove(m);
}

// ---------- coin ----------
const coin = new THREE.Mesh(new THREE.CylinderGeometry(.36, .36, .06, 40), [
  new THREE.MeshStandardMaterial({ color: 0xc9a032, metalness: .8, roughness: .3 }),
  new THREE.MeshStandardMaterial({ map: coinTex(true), metalness: .5, roughness: .35 }),
  new THREE.MeshStandardMaterial({ map: coinTex(false), metalness: .5, roughness: .35 })]);
coin.castShadow = true; coin.visible = false; scene.add(coin);
async function flipCoin(pos, heads) {
  coin.visible = true; coin.position.copy(pos); coin.rotation.set(0, 0, 0);
  const spins = 4 + (Math.random() * 3 | 0), finalX = heads ? 0 : Math.PI;
  beep(300, .05, 'square', .03);

    const v = f.pos.clone().add(new THREE.Vector3(0, f.t * .8, 0)).project(camera);
    f.el.style.left = r.left + (v.x + 1) / 2 * r.width + 'px'; f.el.style.top = r.top + (1 - v.y) / 2 * r.height + 'px';
    f.el.style.opacity = Math.max(0, 1 - Math.max(0, f.t - .8) / .6);
    if (f.t > 1.4) { f.el.remove(); floats.splice(i, 1); }
  }
}
function setTargets(ts) { if (S) S.targets = ts; }
function passScreen(p) {
  return new Promise((res) => {
    showOverlay(`<h2 style="color:${PCSS[p.i]}">${p.name} is aan de beurt</h2><p>Geef het apparaat door. Je actiekaarten blijven verborgen tot je verder tikt.</p>
      <div class="btns"><button id="goPass">Ik ben er klaar voor</button></div>`);
    $('goPass').onclick = () => { hideOverlay(); res(); };
  });
}
function statusIcons(p) {
  return [p.lucky && '🪙', p.sabotaged && '💣', p.double && '⚡', p.equal && '⚖️', p.second && '🍀'].filter(Boolean).join(' ');
}
function updateUI() {
  if (!S) return;
  const d = dominance();
  for (const p of S.players) {
    const el = $('p' + p.i + 'info'), tiles = S.tiles.filter((t) => t.owner === p.i).length;
    el.classList.toggle('active', S.cur === p.i && !S.over);
    el.innerHTML = `<div class="nm">${p.name} ${statusIcons(p)}</div><div class="st">🏠 ${tiles} · ⭐ ${ownedValue(p.i)} · ${Math.round(d[p.i] * 100)}% · 🂠 ${p.hand.length}</div>`;
  }
  $('dom0').style.width = d[0] * 100 + '%'; $('dom1').style.width = d[1] * 100 + '%';
  const tl = Math.max(0, S.timeLeft);
  $('timer').textContent = `${Math.floor(tl / 60)}:${String(Math.floor(tl % 60)).padStart(2, '0')}`;
  $('timer').classList.toggle('low', tl < 60);
  $('turnlbl').textContent = `Beurt ${S.turn + 1} · ${S.players[S.cur].name} · stapel ${S.deck.length}`;
  const human = isHumanTurn(), guessing = human && S.phase === 'guess';
  $('bLower').disabled = $('bHigher').disabled = !guessing;
  $('bCash').disabled = !(guessing && S.tokens > 0);
  $('bCash').textContent = S.phase === 'claim' ? `Kies vakje (${S.claims})` : `Claim vastgoed (${S.tokens})`;
  $('bCancel').style.display = human && S.phase === 'target' ? 'block' : 'none';
  $('tokens').textContent = S.tokens ? '★'.repeat(Math.min(S.tokens, 6)) : S.current ? cardLabel(S.current) : '';
  $('peek').textContent = human && S.peek ? `🔭 Volgende kaart: ${cardLabel(S.peek)}` : '';
  if (guessing) say(S.tokens === 0
    ? `Is de volgende kaart hoger of lager dan ${cardLabel(S.current)}?`
    : `${S.tokens} claim${S.tokens > 1 ? 's' : ''}! Raad verder (risico) of claim vastgoed. Open kaart: ${cardLabel(S.current)}.`);
  else if (human && S.phase === 'claim') say(`Kies een oplichtend vakje om te claimen (${S.claims} over). ${canAttackFlag(S.cur) ? 'Vlag = 2× kop.' : 'Vlag 🔒 tot je meer vastgoedwaarde hebt.'}`);
  renderHand();
}
function renderHand() {
  const hand = $('hand'); hand.innerHTML = '';
  if (!S) return;
  const viewer = S.mode === 'ai' ? 0 : S.cur, p = S.players[viewer];
  if (S.mode === 'pvp' && S.phase === 'pass') { hand.innerHTML = '<div class="empty">Kaarten verborgen tot de volgende speler klaar is.</div>'; return; }
  p.hand.forEach((c, i) => {
    const A = ACTIONS[c.id], el = document.createElement('button');
    el.className = 'hcard'; el.innerHTML = `<div class="ic">${A.icon}</div><b>${A.name}</b><small>${A.text}</small>`;
    el.disabled = !(S.phase === 'guess' && S.cur === viewer && isHumanTurn() && canPlay(viewer, c.id));
    el.onclick = () => playCard(viewer, i);
    hand.append(el);
  });
  if (!p.hand.length) hand.innerHTML = `<div class="empty">Geen actiekaarten. Er zitten ${Object.values(ACTIONS).reduce((s, a) => s + a.count, 0)} actiekaarten verstopt in de stapel.</div>`;
}

function showOverlay(html) { const o = $('overlay'); o.innerHTML = `<div class="box">${html}</div>`; o.classList.remove('hidden'); }
function hideOverlay() { $('overlay').classList.add('hidden'); }
const RULES = `<ul>
  <li><b>Hoger of lager:</b> raad om de beurt of de volgende kaart hoger of lager is. Gelijk telt als fout. Aas is hoog.</li>
  <li><b>Claims:</b> elke goede gok geeft een claim. Raad verder voor meer, maar één foute gok en al je claims zijn weg.</li>
  <li><b>Kop of munt:</b> verzilver je claims op vakjes die aan jouw gebied grenzen. Kop = het vastgoed is van jou, ook als het van je tegenstander was.</li>
  <li><b>Capture the flag:</b> de vijandelijke vlag kun je alleen aanvallen als jij meer vastgoedwaarde hebt dan je tegenstander. Daarna is 2× kop achter elkaar nodig. Verover hem en je wint direct.</li>
  <li><b>Dominance:</b> huis = 1, winkel = 2, toren = 3. Bezit je bij de start van je beurt ${Math.round(DOM_WIN * 100)}% van alle waarde, dan win je.</li>
  <li><b>Actiekaarten:</b> 15 actiekaarten zitten in de stapel. Trek je er een, dan gaat hij naar je hand (max ${HAND_MAX}). Speel ze tijdens je beurt.</li>
  <li><b>Tijd:</b> een ronde duurt maximaal 10 minuten. Daarna wint de hoogste vastgoedwaarde.</li></ul>`;
function showMenu() {
  showOverlay(`<h1>HIGHER GROUND</h1><p style="margin:0;font-size:11px;color:#6f789a">v${VERSION}</p><p>Raad hoger of lager, win de muntworp en verover de vlag.</p>${RULES}
    <div class="btns"><button data-mode="ai">Speel tegen de AI</button><button class="alt" data-mode="pvp">2 spelers (zelfde scherm)</button></div>`);
}
$('overlay').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.mode) startGame(b.dataset.mode);
  else if (b.hasAttribute('data-menu')) showMenu();
  else if (b.hasAttribute('data-close')) hideOverlay();
});
$('help').onclick = () => showOverlay(`<h2>Spelregels</h2>${RULES}<div class="btns"><button data-close>Verder spelen</button><button class="alt" data-menu>Stoppen en naar menu</button></div>`);
$('bHigher').onclick = () => isHumanTurn() && guess('higher');
$('bLower').onclick = () => isHumanTurn() && guess('lower');
$('bCash').onclick = () => isHumanTurn() && cashIn();
$('bCancel').onclick = () => { if (S?.phase === 'target') { S.phase = 'guess'; S.pending = null; setTargets([]); updateUI(); } };
addEventListener('keydown', (e) => {
  if (!isHumanTurn()) return;
  if (e.key === 'ArrowUp') guess('higher'); else if (e.key === 'ArrowDown') guess('lower');
  else if (e.key === 'Enter' || e.key === ' ') cashIn(); else if (e.key === 'Escape') $('bCancel').onclick();
});

// ---------- picking ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function tileFromEvent(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObjects(hitMeshes)[0]?.object.userData.tile ?? null;
}
canvas.addEventListener('pointerdown', (e) => {
  if (!isHumanTurn()) return;
  const t = tileFromEvent(e); if (!t || !S.targets.includes(t)) return;
  if (S.phase === 'claim') attemptClaim(t);
  else if (S.phase === 'target') { const idx = S.pending; S.pending = null; S.phase = 'guess'; setTargets([]); playCard(S.cur, idx, t); }
});
canvas.addEventListener('pointermove', (e) => {
  const tip = $('tip'), t = S && e.pointerType === 'mouse' ? tileFromEvent(e) : null;
  canvas.style.cursor = t && S.targets.includes(t) && isHumanTurn() ? 'pointer' : 'default';
  if (!t) { tip.style.display = 'none'; return; }
  const own = t.owner < 0 ? 'neutraal' : S.players[t.owner].name;
  const lock = t.flag >= 0 && t.flag !== S.cur && !canAttackFlag(S.cur) ? ' · 🔒 eerst meer vastgoedwaarde nodig' : '';
  tip.textContent = `${t.flag >= 0 ? 'Hoofdkwartier (vlag)' : TILE_NAMES[t.value]} · waarde ${t.value} · ${own}${t.shield ? ' · 🛡️ ' + t.shield : ''}${lock}`;
  Object.assign(tip.style, { display: 'block', left: e.clientX + 14 + 'px', top: e.clientY + 10 + 'px' });
});
canvas.addEventListener('pointerleave', () => { $('tip').style.display = 'none'; });

// ---------- loop ----------
let elapsed = 0, uiTick = 0, lastStep = performance.now();
// Game logic advances with real time; requestAnimationFrame drives it normally and the interval keeps
// tweens and the round clock going when the browser throttles animation frames.
function step() {
  const now = performance.now(), dt = Math.min((now - lastStep) / 1000, .1) * SPEED; lastStep = now; elapsed += dt;
  updateTweens(dt); updateFloats(dt);
  if (S) {
    for (const t of S.tiles) {
      t.mesh.material.emissiveIntensity = S.targets.includes(t) ? .25 + Math.sin(elapsed * 6) * .2 : 0;
      t.mesh.position.y = S.targets.includes(t) ? Math.sin(elapsed * 6) * .025 + .03 : 0;
      const cloth = t.bld.userData.cloth;
      if (cloth) {
        const a = cloth.geometry.attributes.position, b = t.bld.userData.base;
        for (let i = 0; i < a.count; i++) a.array[i * 3 + 2] = Math.sin(b[i * 3] * 7 - elapsed * 5) * .07 * b[i * 3];
        a.needsUpdate = true;
      }
      if (t.shield) t.dome.material.opacity = .22 + Math.sin(elapsed * 3) * .06;
    }
    if (S.started && !S.over) {
      S.timeLeft -= dt;
      if ((uiTick += dt) > .25) { uiTick = 0; $('timer').textContent = `${Math.floor(Math.max(0, S.timeLeft) / 60)}:${String(Math.floor(Math.max(0, S.timeLeft) % 60)).padStart(2, '0')}`; $('timer').classList.toggle('low', S.timeLeft < 60); }
      if (S.timeLeft <= 0) timeUp();
    }
  }
  renderer.render(scene, camera);
}
function frame() { step(); requestAnimationFrame(frame); }
setInterval(() => { if (performance.now() - lastStep > 200) step(); }, 100);
resize(); showMenu(); frame();
window.__hg = { get state() { return S; }, guess, cashIn, playCard };
</script>
