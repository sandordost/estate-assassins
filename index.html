<!doctype html>
<html lang="nl">
<head>

<title>Higher Ground</title>
<style>
  :root {

  .hero { border-radius: 14px; padding: 12px 10px; text-align: left; background: #1b2442; border: 2px solid var(--hc);
    display: flex; flex-direction: column; gap: 4px; transition: transform .15s; color: var(--text); }
  .hero:not(:disabled):hover { transform: translateY(-3px); box-shadow: 0 6px 24px color-mix(in srgb, var(--hc) 40%, transparent); }
  .hero:disabled { opacity: .3; }
  .hero .hi { font-size: 40px; line-height: 1; text-align: center; filter: drop-shadow(0 0 10px var(--hc)); }
  .hero .hn { font-weight: 900; font-size: 18px; color: var(--hc); text-align: center; }
  .hero .ht { font-size: 12px; color: var(--muted); text-align: center; margin-top: -4px; }

  @media (max-width: 640px) { .heroes { grid-template-columns: 1fr; } .hero .hi { font-size: 30px; } }
  #pip { position: absolute; right: 12px; top: 76px; bottom: 12px; width: var(--pipw); display: none; flex-direction: column; gap: 6px; z-index: 5; }

  #pip .frame { flex: 1; border-radius: 30px; border: 5px solid var(--pc); background: #0b1020; overflow: hidden; position: relative;

  @media (max-width: 900px) { :root { --pipw: 210px; } }

    pointer-events: none; }

  .hcard { overflow: hidden; }
  #controls button { white-space: nowrap; }
  .hcard.back { background: repeating-linear-gradient(45deg, #142a5c 0 8px, #1b3570 8px 16px); }
  .empty { color: var(--muted); align-self: center; text-align: center; font-size: 12px; }

  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5, 8, 18, .78); backdrop-filter: blur(4px); z-index: 10; padding: 16px; }
  #overlay.hidden { display: none; }
  .box { background: #121a33; border: 1px solid var(--line); border-radius: 18px; padding: 22px; max-width: 560px;
    width: 100%; max-height: 100%; overflow: auto; }
  .box h1 { margin: 0; font-size: 34px; letter-spacing: 2px; background: linear-gradient(90deg, var(--p0), var(--gold), var(--p1));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .box h2 { margin: 0 0 8px; }
  .box p { color: #c8cee6; } .box ul { padding-left: 18px; color: #c8cee6; } .box li { margin: 4px 0; }
  .box .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .box .btns button { flex: 1; border: 0; border-radius: 12px; padding: 12px; font-weight: 800; font-size: 15px;
    background: linear-gradient(#f2d06e, #c99a2c); color: #2a1b00; min-width: 160px; }
  .box .btns button.alt { background: #2a3350; color: var(--text); }
  #help { position: absolute; top: 72px; right: 10px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--panel); font-weight: 800; }

  #banner { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 30px; font-weight: 900;
    text-shadow: 0 2px 16px #000; pointer-events: none; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  .float { position: absolute; transform: translate(-50%, -50%); font-weight: 900; font-size: 22px; pointer-events: none;
    text-shadow: 0 2px 8px #000; white-space: nowrap; }
  #tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 4px 8px; font-size: 12px; display: none; }

  @media (max-width: 640px) {
    #top { grid-template-columns: 1fr 120px 1fr; padding: 4px 6px; }
    .pinfo { padding: 2px 6px; } #timer { font-size: 17px; }
    #controls button { padding: 10px 10px; min-width: 70px; font-size: 15px; }
    .hcard { flex-basis: 92px; padding: 4px; } .hcard .ic { font-size: 20px; } .hcard small { font-size: 9.5px; }
    #controls { gap: 6px; } #controls button { padding: 10px 8px; min-width: 0; flex: 1; font-size: 14px; }
    #tokens { min-width: 34px; font-size: 13px; }
    #msg { border-radius: 12px; font-size: 12.5px; padding: 5px 10px; top: 68px; }
    .box h1 { font-size: 28px; }
  }
</style>

<canvas id="c"></canvas>
<div id="top">
  <div class="pinfo" id="p0info"></div>
  <div id="center"><div id="timer">10:00</div><div id="dombar"><div id="dom0"></div><div id="domN"></div><div id="dom1"></div></div><div id="turnlbl"></div></div>

<div id="pip"><div class="lbl" id="pipLbl"></div><div class="frame" id="pipFrame"><iframe id="pipView" title="Telefoon van de speler die aan de beurt is" tabindex="-1"></iframe></div></div>

<div id="tip"></div>

<script type="module">
import * as THREE from 'three';

// ---------- constants ----------
const $ = (id) => document.getElementById(id);
const VERSION = '0.4.0';
let remoteSeats = [{ taken: false, online: false }, { taken: false, online: false }];
const COLS = 5, ROWS = 6, SP = 1.15, HAND_MAX = 5, ROUND_SECONDS = 600, DOM_WIN = 0.6;
const PCSS = ['#3fa9ff', '#ff5a4f'];
const TILE_COL = [0x1f5f99, 0x99332d], TILE_NEUTRAL = 0x3c4250;
const BLD_COL = [0x5cb8ff, 0xff7a6e], BLD_NEUTRAL = 0xd8d2c4;
const SUITS = ['♠', '♥', '♦', '♣'];
const rankLabel = (r) => ({ 11: 'J', 12: 'Q', 13: 'K', 14: 'A' })[r] || String(r);
const cardLabel = (c) => rankLabel(c.rank) + SUITS[c.suit];
const TILE_NAMES = { 1: 'Huis', 2: 'Winkel', 3: 'Toren' };

// Three playable heroes: a card duelist (Yu-Gi-Oh-inspired), a ki warrior (Dragon Ball-inspired) and a seer.
// Each has a passive and a once-per-round super.
const CHARACTERS = {
  duelist: { name: 'Kaito', title: 'De Duellist', icon: '🃏', color: '#b07cff', glow: 0xb07cff,
    passive: 'Start met 2 actiekaarten en mag er 6 vasthouden.', superName: 'Kaartenregen', superIcon: '🌠',
    superText: 'Trek meteen de volgende 2 actiekaarten uit de stapel.', shout: 'Mijn beurt! Kaartenregen!' },
  warrior: { name: 'Raiden', title: 'De Ki-krijger', icon: '🔥', color: '#ffb02e', glow: 0xffa020,
    passive: 'Power-up: vanaf je 3e goede gok in één beurt krijg je +1 extra claim per goede gok.', superName: 'Ki-golf', superIcon: '💥',
    superText: 'Je volgende muntworp is gegarandeerd kop, ook tegen sabotage.', shout: 'Ki-golf… LOS!' },
  seer: { name: 'Mira', title: 'De Zienster', icon: '👁️', color: '#4fe3c1', glow: 0x4fe3c1,
    passive: 'Een gelijke kaart telt altijd als goed geraden.', superName: 'Derde oog', superIcon: '🔮',
    superText: 'Zie de volgende 2 speelkaarten van de stapel.', shout: 'Ik zie wat komen gaat…' },
};
const CHAR_IDS = Object.keys(CHARACTERS);
const handMax = (p) => p.char === 'duelist' ? HAND_MAX + 1 : HAND_MAX;

// 15 action cards hidden in the deck (Yu-Gi-Oh/Magic style: drawn into your hand, played on your turn).
const ACTIONS = {
  lucky:    { name: 'Gouden munt',    icon: '🪙', count: 2, text: 'Je volgende muntworp valt gegarandeerd op kop.' },
  peek:     { name: 'Verrekijker',    icon: '🔭', count: 2, text: 'Bekijk de volgende speelkaart voordat je raadt.' },
  double:   { name: 'Dubbel of niks', icon: '⚡', count: 2, text: 'Je volgende goede gok levert 2 claims op.' },
  second:   { name: 'Tweede kans',    icon: '🍀', count: 2, text: 'Je volgende foute gok deze beurt telt niet.' },
  shield:   { name: 'Schild',         icon: '🛡️', count: 2, target: 'own', text: 'Bescherm een eigen vakje tijdens 2 beurten van je tegenstander.' },
  equal:    { name: 'Gelijkspel',     icon: '⚖️', count: 1, text: 'Deze beurt telt een gelijke kaart als goed geraden.' },
  sabotage: { name: 'Sabotage',       icon: '💣', count: 1, text: 'De volgende muntworp van je tegenstander mislukt.' },
  quake:    { name: 'Aardbeving',     icon: '🌋', count: 1, text: 'Een willekeurig vijandelijk vakje (geen vlag) wordt weer neutraal.' },
  swap:     { name: 'Ruil',           icon: '🔄', count: 1, text: 'Vervang de open kaart door een nieuwe.' },
  takeover: { name: 'Overname',       icon: '🏗️', count: 1, target: 'claim', text: 'Claim een aangrenzend vakje zonder munt (geen vlag).' },
};

// ---------- helpers ----------
// Test hooks: ?speed=N runs the whole game N× faster, ?autoplay lets the AI play both sides.
const params = new URLSearchParams(location.search);
const REMOTE = location.protocol.startsWith('http') && !params.has('noremote');
const SPEED = Math.max(1, Number(params.get('speed')) || 1), AUTOPLAY = params.has('autoplay');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms / SPEED));
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a) => a[Math.random() * a.length | 0];
const easeInOut = (k) => k < .5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
const tweens = [];
const tween = (dur, fn, ease = easeInOut) => new Promise((res) => tweens.push({ t: 0, dur, fn, ease, res }));
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur);
    tw.fn(tw.ease(k)); if (k >= 1) { tweens.splice(i, 1); tw.res(); }
  }
}
// ---------- sound: everything is synthesised with WebAudio, no audio files ----------
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch { /* storage blocked */ } } };
const SFX = (() => {
  let ctx = null, master = null, sfxBus = null, musicBus = null, noiseBuf = null, musicOn = false;
  let muted = store.get('hg-muted') === '1';
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = .9; sfxBus.connect(master);
    musicBus = ctx.createGain(); musicBus.gain.value = .0; musicBus.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(f, t, dur, { type = 'sine', vol = .08, to, attack = .006, bus = sfxBus } = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(bus); o.start(t); o.stop(t + dur + .05);
  }
  function noise(t, dur, { vol = .1, freq = 2000, to, q = 1, type = 'bandpass', attack = .004 } = {}) {
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf; f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(freq, t); if (to) f.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(f).connect(g).connect(sfxBus); src.start(t); src.stop(t + dur + .05);
  }
  const arp = (t, notes, step, opts) => notes.forEach((f, i) => tone(f, t + i * step, opts?.dur ?? .25, opts));
  const S_ = {
    click: (t) => tone(1200, t, .04, { type: 'square', vol: .03 }),
    start: (t) => { arp(t, [262, 330, 392, 523], .09, { type: 'triangle', vol: .07, dur: .35 }); noise(t, .6, { freq: 6000, to: 1500, vol: .04 }); },
    turn: (t) => { tone(660, t, .18, { type: 'sine', vol: .06 }); tone(990, t + .09, .3, { type: 'sine', vol: .05 }); },
    deal: (t) => { noise(t, .09, { freq: 4500, to: 1800, vol: .14, q: .8 }); tone(180, t + .05, .06, { type: 'triangle', vol: .05 }); },
    flip: (t) => { noise(t, .07, { freq: 5000, to: 2500, vol: .12 }); noise(t + .1, .06, { freq: 3000, to: 1200, vol: .1 }); },
    draw_action: (t) => { arp(t, [784, 988, 1175, 1568], .06, { type: 'sine', vol: .05, dur: .4 }); noise(t, .5, { freq: 8000, to: 4000, vol: .03, q: 4 }); },
    correct: (t, streak = 1) => { const b = 523 * 2 ** (Math.min(streak - 1, 6) / 12); arp(t, [b, b * 1.26, b * 1.5], .07, { type: 'triangle', vol: .07, dur: .3 }); },
    powerup: (t) => { tone(220, t, .5, { type: 'sawtooth', vol: .05, to: 880 }); arp(t + .25, [880, 1109, 1319], .06, { type: 'square', vol: .04, dur: .25 }); noise(t, .5, { freq: 800, to: 4000, vol: .05 }); },
    wrong: (t) => { tone(311, t, .18, { type: 'sawtooth', vol: .06 }); tone(220, t + .16, .4, { type: 'sawtooth', vol: .06, to: 140 }); },
    save: (t) => arp(t, [392, 523, 659], .07, { type: 'sine', vol: .07 }),
    coin_toss: (t) => { tone(2400, t, .25, { type: 'sine', vol: .05 }); tone(3200, t, .2, { type: 'sine', vol: .03 }); noise(t, .08, { freq: 7000, vol: .05 }); },
    coin_spin: (t) => { for (let i = 0; i < 7; i++) tone(2600 + (i % 2) * 500, t + i * .11, .05, { type: 'sine', vol: .018 }); },
    coin_land: (t) => { noise(t, .05, { freq: 3500, vol: .12 }); tone(1800, t, .35, { type: 'sine', vol: .05 }); tone(2700, t + .01, .25, { type: 'sine', vol: .03 }); },
    heads: (t) => arp(t, [659, 988], .08, { type: 'triangle', vol: .08, dur: .35 }),
    tails: (t) => tone(247, t, .35, { type: 'triangle', vol: .07, to: 196 }),
    claim: (t) => { arp(t, [523, 659, 784], .0, { type: 'triangle', vol: .05, dur: .6 }); noise(t, .15, { freq: 300, vol: .08, type: 'lowpass' }); },
    steal: (t) => { tone(196, t, .3, { type: 'sawtooth', vol: .05 }); arp(t + .12, [587, 740, 880], .06, { type: 'square', vol: .04, dur: .3 }); },
    fail: (t) => tone(392, t, .3, { type: 'sine', vol: .05, to: 330 }),

// ---------- game state ----------
let S = null;

// Fill missing or duplicate picks with a random free hero.

async function startGame(mode, picks = []) {

}

async function beginTurn() {

  S.phase = S.mode === 'pvp' ? 'pass' : 'busy'; updateUI();

async function guess(dir) {

  await revealCard(next); if (dead(id)) return;
  S.discard.push(prev); S.current = next; shiftPeek();
  const tie = next.rank === prev.rank;
  const right = tie ? p.equal || p.char === 'seer' : dir === 'higher' ? next.rank > prev.rank : next.rank < prev.rank;
  const where = pile.localToWorld(new THREE.Vector3(CUR_X, 1.2, .3));
  if (right) {
    S.streak = (S.streak || 0) + 1;

    const gain = (p.double ? 2 : 1) + (powerUp ? 1 : 0); p.double = false; S.tokens += gain;
    floatText(`${powerUp ? '🔥 Power-up! ' : tie ? '👁️ Gelijk = goed! ' : 'Goed! '}+${gain} claim${gain > 1 ? 's' : ''}`, where, powerUp ? '#ffb02e' : '#7dffa8');
    SFX.play(powerUp ? 'powerup' : 'correct', S.streak);

  say(`${cardLabel(next)}: fout geraden${S.tokens ? `, ${S.tokens} claim${S.tokens > 1 ? 's' : ''} verloren` : ''}.`);
  S.tokens = 0; updateUI();

}

function cashIn() {

async function attemptClaim(t) {

  for (let i = 0; i < need && ok; i++) {

    else if (p.sabotaged > 0) { p.sabotaged--; heads = false; say('💣 Gesaboteerd! De munt valt verkeerd.'); }
    else if (p.lucky > 0) { p.lucky--; heads = true; say('🪙 Gouden munt: gegarandeerd kop.'); }

// ---------- action cards ----------
function cardTargets(pi, kind) {

// ---------- hero supers ----------
const canSuper = (pi) => { const p = S?.players[pi]; return !!p && !p.superUsed && S.cur === pi && S.phase === 'guess' && !S.over; };
async function useSuper(pi) {

  const p = S.players[pi], C = CHARACTERS[p.char], id = S.turnId;
  p.superUsed = true; S.phase = 'busy'; updateUI();
  SFX.play('super_' + p.char); heroBurst(pi);

  await banner(`${C.superIcon} ${C.superName}!`, C.color, 1100);

    let got = 0;
    for (let i = S.deck.length - 1; i >= 0 && got < 2; i--) if (S.deck[i].kind === 'action') {
      const [card] = S.deck.splice(i, 1); got++;

  } else if (p.char === 'warrior') p.ki = true;

// ---------- AI ----------
function aiSuper(p, pr) {
  if (p.superUsed) return false;
  if (p.char === 'duelist') return p.hand.length <= 2 && S.turn >= 2;
  if (p.char === 'seer') return !S.peek && aiBest(p, pr) < .66;

  const best = aiBest(p, pr);

  return (t.flag === 1 - pi ? 60 * (S.players[pi].lucky ? 2 : 1) : 0) + t.value * 2 + (10 - dist) * 1.4 + (t.owner === 1 - pi ? 2 : 0) + Math.random();

  const best = aiBest(p, pr), cont = aiContinue(p, pr);

  if ((i = has('sabotage')) >= 0 && !S.players[1 - pi].sabotaged) return { idx: i };
  if ((i = has('takeover')) >= 0) {
    const t = cardTargets(pi, 'claim').sort((a, b) => aiTargetScore(pi, b) - aiTargetScore(pi, a))[0];
    return { idx: i, target: t };
  }
  if ((i = has('shield')) >= 0 && !S.aiShielded) {
    const exposed = cardTargets(pi, 'own').filter((t) => neighbors(t).some((n) => n.owner === 1 - pi))
      .sort((a, b) => (b.flag >= 0 ? 10 : b.value) - (a.flag >= 0 ? 10 : a.value));
    if (exposed.length) { S.aiShielded = true; return { idx: i, target: exposed[0] }; }
  }
  if (S.tokens > 0 && !cont && !p.lucky && (i = has('lucky')) >= 0) return { idx: i };

    if (!aiContinue(p, pr)) { await sleep(500); if (!dead(id)) cashIn(); return; }
    const dir = aiDir(pr);
    say(`AI-rivaal kiest ${dir === 'higher' ? '▲ hoger' : '▼ lager'} dan ${cardLabel(S.current)}…`);

async function aiClaim(id) {

  setTargets([t]); await sleep(350); if (dead(id)) return;
  attemptClaim(t);

// ---------- end of round ----------
function timeUp() {
  const v0 = ownedValue(0), v1 = ownedValue(1);
  const c0 = S.tiles.filter((t) => t.owner === 0).length, c1 = S.tiles.filter((t) => t.owner === 1).length;
  gameOver(v0 !== v1 ? (v0 > v1 ? 0 : 1) : c0 !== c1 ? (c0 > c1 ? 0 : 1) : -1, 'time');
}
function gameOver(winner, reason) {

  S.over = true; S.phase = 'over'; setTargets([]); updateUI();
  const d = dominance().map((x) => Math.round(x * 100));
  const why = { flag: 'De vijandelijke vlag is veroverd!', dominance: `Dominance van ${Math.round(DOM_WIN * 100)}% bereikt.`, time: 'De 10 minuten zijn om: de meeste vastgoedwaarde wint.' }[reason];
  const title = winner < 0 ? 'Gelijkspel' : S.mode === 'ai' ? (winner === 0 ? 'Je wint!' : 'De AI-rivaal wint') : `${S.players[winner].name} wint!`;
  S.result = { title, why, winner };
  SFX.play(winner < 0 ? 'draw' : (S.mode === 'ai' && winner === 1) ? 'lose' : 'win');
  const used = ROUND_SECONDS - Math.max(0, S.timeLeft);
  showOverlay(`<h2 style="color:${winner < 0 ? '#fff' : PCSS[winner]}">${title}</h2><p>${why}</p>
    <ul><li>Dominance: ${S.players[0].name} ${d[0]}% · ${S.players[1].name} ${d[1]}%</li>
    <li>Speeltijd: ${Math.floor(used / 60)}:${String(Math.floor(used % 60)).padStart(2, '0')} · ${S.turn + 1} beurten</li></ul>
    <div class="btns"><button data-again>Nog een ronde</button><button class="alt" data-menu>Menu</button></div>`);

let bannerTimer;

function updateFloats(dt) {

  const human = isHumanTurn(), guessing = human && S.phase === 'guess';
  $('bLower').disabled = $('bHigher').disabled = !guessing;
  $('bCash').disabled = !(guessing && S.tokens > 0);
  $('bCash').textContent = S.phase === 'claim' ? `Kies vakje (${S.claims})` : `Claim vastgoed (${S.tokens})`;
  $('bCancel').style.display = human && S.phase === 'target' ? 'block' : 'none';
  const sc = CHARACTERS[S.players[S.cur].char];
  $('bSuper').textContent = `${sc.superIcon} ${sc.superName}`; $('bSuper').title = sc.superText;
  $('bSuper').style.setProperty('--sc', sc.color);
  $('bSuper').disabled = !(human && S.mode !== 'remote' && canSuper(S.cur));
  $('bSuper').style.display = human && !S.players[S.cur].superUsed ? '' : 'none';
  $('tokens').textContent = S.tokens ? '★'.repeat(Math.min(S.tokens, 6)) : S.current ? cardLabel(S.current) : '';
  $('peek').textContent = human && S.peek ? `🔭 Volgende kaart: ${cardLabel(S.peek)}` : '';
  if (guessing) say(S.tokens === 0
    ? `Is de volgende kaart hoger of lager dan ${cardLabel(S.current)}?`
    : `${S.tokens} claim${S.tokens > 1 ? 's' : ''}! Raad verder (risico) of claim vastgoed. Open kaart: ${cardLabel(S.current)}.`);
  else if (human && S.phase === 'claim') say(`Kies een oplichtend vakje om te claimen (${S.claims} over). ${canAttackFlag(S.cur) ? 'Vlag = 2× kop.' : 'Vlag 🔒 tot je meer vastgoedwaarde hebt.'}`);
  renderHand(); pushRemote();
}
function renderHand() {
  const hand = $('hand'); hand.innerHTML = '';
  if (!S) return;
  const viewer = S.mode === 'ai' ? 0 : S.cur, p = S.players[viewer];
  if (S.mode === 'pvp' && S.phase === 'pass') { hand.innerHTML = '<div class="empty">Kaarten verborgen tot de volgende speler klaar is.</div>'; return; }
  p.hand.forEach((c, i) => {
    const A = ACTIONS[c.id], el = document.createElement('button');
    el.className = 'hcard'; el.innerHTML = `<div class="ic">${A.icon}</div><b>${A.name}</b><small>${A.text}</small>`;
    el.disabled = !(S.phase === 'guess' && S.cur === viewer && isHumanTurn() && canPlay(viewer, c.id));
    el.onclick = () => playCard(viewer, i);
    hand.append(el);
  });
  if (!p.hand.length) hand.innerHTML = `<div class="empty">Geen actiekaarten. Er zitten ${Object.values(ACTIONS).reduce((s, a) => s + a.count, 0)} actiekaarten verstopt in de stapel.</div>`;
}

function showOverlay(html) { const o = $('overlay'); o.innerHTML = `<div class="box">${html}</div>`; o.classList.remove('hidden'); }
function hideOverlay() { $('overlay').classList.add('hidden'); }
const RULES = `<ul>
  <li><b>Hoger of lager:</b> raad om de beurt of de volgende kaart hoger of lager is. Gelijk telt als fout. Aas is hoog.</li>
  <li><b>Claims:</b> elke goede gok geeft een claim. Raad verder voor meer, maar één foute gok en al je claims zijn weg.</li>
  <li><b>Kop of munt:</b> verzilver je claims op vakjes die aan jouw gebied grenzen. Kop = het vastgoed is van jou, ook als het van je tegenstander was.</li>
  <li><b>Capture the flag:</b> de vijandelijke vlag kun je alleen aanvallen als jij meer vastgoedwaarde hebt dan je tegenstander. Daarna is 2× kop achter elkaar nodig. Verover hem en je wint direct.</li>
  <li><b>Dominance:</b> huis = 1, winkel = 2, toren = 3. Bezit je bij de start van je beurt ${Math.round(DOM_WIN * 100)}% van alle waarde, dan win je.</li>
  <li><b>Actiekaarten:</b> 15 actiekaarten zitten in de stapel. Trek je er een, dan gaat hij naar je hand (max ${HAND_MAX}). Speel ze tijdens je beurt.</li>
  <li><b>Helden:</b> 🃏 Kaito de Duellist (extra actiekaarten), 🔥 Raiden de Ki-krijger (power-up bij lange reeksen) en 👁️ Mira de Zienster (gelijk telt als goed). Elke held heeft één super per ronde.</li>
  <li><b>Tijd:</b> een ronde duurt maximaal 10 minuten. Daarna wint de hoogste vastgoedwaarde.</li></ul>`;
function heroCards(taken, mine) {
  return `<div class="heroes">${CHAR_IDS.map((id) => { const C = CHARACTERS[id];
    return `<button class="hero" style="--hc:${C.color}" data-char="${id}" ${taken.includes(id) && id !== mine ? 'disabled' : ''}>
      <div class="hi">${C.icon}</div><div class="hn">${C.name}</div><div class="ht">${C.title}</div>
      <div class="hp"><b>Passief:</b> ${C.passive}</div><div class="hs"><b>${C.superIcon} ${C.superName} (1×):</b> ${C.superText}</div></button>`; }).join('')}</div>`;
}
let charSelect = null;
function showCharSelect(mode, picks = []) {
  charSelect = { mode, picks };
  const who = mode === 'ai' ? 'Kies je held' : `Speler ${picks.length + 1}: kies je held`;
  showOverlay(`<h2 style="color:${PCSS[picks.length]}">${who}</h2>
    <p>Geïnspireerd op kaartduels en ki-gevechten. Elke held heeft een passieve kracht en één super per ronde.</p>
    ${heroCards(picks, null)}<div class="btns"><button class="alt" data-menu>Terug</button></div>`);
}
function onCharPicked(id) {
  if (!charSelect) return;
  const { mode, picks } = charSelect; picks.push(id);
  SFX.play('super_' + id);
  if (mode === 'pvp' && picks.length < 2) showCharSelect(mode, picks);
  else { charSelect = null; startGame(mode, picks); }
}

function showMenu() {
  showOverlay(`<h1>HIGHER GROUND</h1><p style="margin:0;font-size:11px;color:#6f789a">v${VERSION}</p><p>Raad hoger of lager, win de muntworp en verover de vlag.</p>${RULES}
    <div class="btns"><button data-mode="ai">Speel tegen de AI</button>${REMOTE ? '<button data-lobby>Spelen met telefoons</button>' : ''}<button class="alt" data-mode="pvp">2 spelers (zelfde scherm)</button></div>
    ${REMOTE ? '' : '<p style="font-size:12px;color:#8891b0">Spelen met telefoons? Start de server met <code>node server.mjs</code> en open het adres dat hij toont.</p>'}`);
  document.body.classList.remove('remote'); resize();
  if (S?.mode === 'remote') { S.over = true; S = null; }
  pushLobby();
}
$('overlay').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.char) onCharPicked(b.dataset.char);
  else if (b.dataset.mode) b.dataset.mode === 'remote' ? startGame('remote') : showCharSelect(b.dataset.mode);
  else if (b.hasAttribute('data-again')) startGame(S.mode, S.chars);
  else if (b.hasAttribute('data-menu')) showMenu();
  else if (b.hasAttribute('data-lobby')) showLobby();
  else if (b.hasAttribute('data-reset')) fetch('/reset', { method: 'POST' });
  else if (b.hasAttribute('data-close')) hideOverlay();
});
$('help').onclick = () => showOverlay(`<h2>Spelregels</h2>${RULES}<div class="btns"><button data-close>Verder spelen</button><button class="alt" data-menu>Stoppen en naar menu</button></div>`);
// In phone mode the display only shows the game; all input comes from the phones.
const localInput = () => isHumanTurn() && S.mode !== 'remote';
$('bHigher').onclick = () => localInput() && guess('higher');
$('bLower').onclick = () => localInput() && guess('lower');
$('bCash').onclick = () => localInput() && cashIn();
$('bSuper').onclick = () => localInput() && useSuper(S.cur);
$('mute').textContent = SFX.muted ? '🔇' : '🔊';
$('mute').onclick = () => { $('mute').textContent = SFX.toggle() ? '🔇' : '🔊'; };
document.addEventListener('click', (e) => { if (e.target.closest('button')) SFX.play('click'); }, true);
function cancelTarget() { if (S?.phase === 'target') { S.phase = 'guess'; S.pending = null; setTargets([]); updateUI(); } }
$('bCancel').onclick = () => localInput() && cancelTarget();
function chooseTile(t) {
  if (!t || !S.targets.includes(t)) return;
  if (S.phase === 'claim') attemptClaim(t);
  else if (S.phase === 'target') { const idx = S.pending; S.pending = null; S.phase = 'guess'; setTargets([]); playCard(S.cur, idx, t); }
}
addEventListener('keydown', (e) => {
  if (!localInput()) return;
  if (e.key === 'ArrowUp') guess('higher'); else if (e.key === 'ArrowDown') guess('lower');
  else if (e.key === 'Enter' || e.key === ' ') cashIn(); else if (e.key === 's' || e.key === 'S') useSuper(S.cur); else if (e.key === 'Escape') $('bCancel').onclick();
});

// ---------- picking ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function tileFromEvent(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObjects(hitMeshes)[0]?.object.userData.tile ?? null;
}
canvas.addEventListener('pointerdown', (e) => { if (localInput()) chooseTile(tileFromEvent(e)); });
canvas.addEventListener('pointermove', (e) => {
  const tip = $('tip'), t = S && e.pointerType === 'mouse' ? tileFromEvent(e) : null;
  canvas.style.cursor = t && S.targets.includes(t) && localInput() ? 'pointer' : 'default';
  if (!t) { tip.style.display = 'none'; return; }
  const own = t.owner < 0 ? 'neutraal' : S.players[t.owner].name;
  const lock = t.flag >= 0 && t.flag !== S.cur && !canAttackFlag(S.cur) ? ' · 🔒 eerst meer vastgoedwaarde nodig' : '';
  tip.textContent = `${t.flag >= 0 ? 'Hoofdkwartier (vlag)' : TILE_NAMES[t.value]} · waarde ${t.value} · ${own}${t.shield ? ' · 🛡️ ' + t.shield : ''}${lock}`;
  Object.assign(tip.style, { display: 'block', left: e.clientX + 14 + 'px', top: e.clientY + 10 + 'px' });
});
canvas.addEventListener('pointerleave', () => { $('tip').style.display = 'none'; });

// ---------- loop ----------
let elapsed = 0, uiTick = 0, remoteTick = 0, lastSec = 0, lastStep = performance.now();
// Game logic advances with real time; requestAnimationFrame drives it normally and the interval keeps
// tweens and the round clock going when the browser throttles animation frames.
function step() {
  const now = performance.now(), dt = Math.min((now - lastStep) / 1000, .1) * SPEED; lastStep = now; elapsed += dt;
  updateTweens(dt); updateFloats(dt);
  if (S) {
    for (const t of S.tiles) {
      const touched = t.touchT != null && elapsed - t.touchT < .6;
      t.mesh.material.emissiveIntensity = touched ? .9 * (1 - (elapsed - t.touchT) / .6) : S.targets.includes(t) ? .25 + Math.sin(elapsed * 6) * .2 : 0;
      t.mesh.position.y = S.targets.includes(t) ? Math.sin(elapsed * 6) * .025 + .03 : 0;
      const cloth = t.bld.userData.cloth;
      if (cloth) {
        const a = cloth.geometry.attributes.position, b = t.bld.userData.base;
        for (let i = 0; i < a.count; i++) a.array[i * 3 + 2] = Math.sin(b[i * 3] * 7 - elapsed * 5) * .07 * b[i * 3];
        a.needsUpdate = true;
      }
      if (t.shield) t.dome.material.opacity = .22 + Math.sin(elapsed * 3) * .06;
    }
    heroSprites.forEach((sp, i) => {
      const active = S.cur === i && !S.over;
      sp.position.y = sp.userData.base + (active ? Math.sin(elapsed * 3) * .08 : 0);
      sp.material.opacity = active || !S.started ? 1 : .55;
    });
    if (S.started && !S.over) {
      S.timeLeft -= dt;
      const sec = Math.ceil(S.timeLeft);
      if (sec !== lastSec) { lastSec = sec; if (sec <= 10 && sec > 0) SFX.play('tick'); }
      if ((uiTick += dt) > .25) { uiTick = 0; if ((remoteTick += .25) >= 1) { remoteTick = 0; pushRemote(); } $('timer').textContent = `${Math.floor(Math.max(0, S.timeLeft) / 60)}:${String(Math.floor(Math.max(0, S.timeLeft) % 60)).padStart(2, '0')}`; $('timer').classList.toggle('low', S.timeLeft < 60); }
      if (S.timeLeft <= 0) timeUp();
    }
  }
  renderer.render(scene, camera);
}
function frame() { step(); requestAnimationFrame(frame); }
setInterval(() => { if (performance.now() - lastStep > 200) step(); }, 100);
// ---------- phones as controllers (server.mjs) ----------
function remoteState(seat) {
  if (!S) return { lobby: true };
  const p = S.players[seat], mine = S.cur === seat && !S.over && !p.ai;
  return {
    seat, name: p.name, opp: S.players[1 - seat].name, cur: S.cur, curName: S.players[S.cur].name, myTurn: mine, phase: S.phase,
    card: S.current && { label: cardLabel(S.current), red: S.current.suit === 1 || S.current.suit === 2 },
    tokens: S.tokens, claims: S.claims, msg: $('msg').textContent, peek: mine && S.peek ? cardLabel(S.peek) : '',
    hand: p.hand.map((c) => ({ id: c.id, name: ACTIONS[c.id].name, icon: ACTIONS[c.id].icon, text: ACTIONS[c.id].text,
      playable: mine && S.phase === 'guess' && canPlay(seat, c.id) })),
    tiles: S.tiles.map((t) => ({ o: t.owner, v: t.value, f: t.flag, s: t.shield, t: mine && S.targets.includes(t) })),
    canGuess: mine && S.phase === 'guess', canCash: mine && S.phase === 'guess' && S.tokens > 0, canCancel: mine && S.phase === 'target',
    timeLeft: Math.max(0, Math.round(S.timeLeft)), dom: dominance().map((x) => Math.round(x * 100)), status: statusIcons(p),
    over: S.over, result: S.result || null,
    hero: { id: p.char, ...CHARACTERS[p.char], glow: undefined }, superUsed: p.superUsed, canSuper: mine && canSuper(seat),
  };
}
let pushTimer = null;
function pushRemote() {
  if (!REMOTE || S?.mode !== 'remote' || pushTimer) return;
  pushTimer = setTimeout(() => {
    pushTimer = null;
    if (S?.mode !== 'remote') return;
    fetch('/state', { method: 'POST', body: JSON.stringify({ seats: [remoteState(0), remoteState(1)] }) }).catch(() => {});
    updatePip();
  }, 40);
}
let remoteChars = [null, null];
// Picture-in-picture: a read-only copy of the current player's phone, fed with the same state the phone gets.
function updatePip() {
  const on = !!(S && S.mode === 'remote' && !S.over && S.started && !S.players[S.cur].ai && remoteSeats[S.cur].taken);
  if (document.body.classList.contains('pipon') !== on) { document.body.classList.toggle('pipon', on); resize(); }
  if (!on) return;
  const p = S.players[S.cur], C = CHARACTERS[p.char];
  $('pip').style.setProperty('--pc', PCSS[S.cur]);
  $('pipLbl').textContent = `📱 Telefoon van ${C.icon} ${p.name}`;
  $('pipView').contentWindow?.postMessage({ type: 'state', seat: S.cur, state: remoteState(S.cur) }, location.origin);
}
function pushLobby() {
  if (!REMOTE) return;
  const heroes = CHAR_IDS.map((id) => ({ id, ...CHARACTERS[id], glow: undefined }));
  fetch('/state', { method: 'POST', body: JSON.stringify({ seats: [0, 1].map((seat) => ({ lobby: true, seat, chars: remoteChars, heroes })) }) }).catch(() => {});
}
function handleRemote(c) {
  if (c.a === 'touch') {
    if (S?.mode !== 'remote' || S.over || c.seat !== S.cur) return;
    $('pipView').contentWindow?.postMessage({ type: 'touch', k: String(c.k) }, location.origin);
    const m = /^tile:(\d+)$/.exec(String(c.k)); if (m && S.tiles[+m[1]]) S.tiles[+m[1]].touchT = elapsed;
    return;
  }
  if (c.a === 'restart') { if (S?.mode === 'remote' && S.over) startGame('remote'); return; }
  if (c.a === 'char') {
    if (S?.mode === 'remote' && !S.over) return;
    if (CHARACTERS[c.hero] && remoteChars[1 - c.seat] !== c.hero) { remoteChars[c.seat] = c.hero; SFX.play('super_' + c.hero); renderSeats(); pushLobby(); }
    return;
  }
  if (c.a === 'super') { if (S?.mode === 'remote' && c.seat === S.cur && !S.players[c.seat].ai) useSuper(c.seat); return; }
  if (!S || S.over || S.mode !== 'remote' || c.seat !== S.cur || S.players[c.seat].ai) return;
  if (c.a === 'guess') guess(c.dir === 'lower' ? 'lower' : 'higher');
  else if (c.a === 'cash') cashIn();
  else if (c.a === 'play') playCard(c.seat, c.idx | 0);
  else if (c.a === 'cancel') cancelTarget();
  else if (c.a === 'tile') chooseTile(S.tiles[c.i | 0]);
}
let remoteInfo = { urls: [] };
async function showLobby() {
  try { remoteInfo = await (await fetch('/info')).json(); } catch { /* server unreachable: lobby shows no address */ }
  showOverlay(`<h2>Spelen met telefoons</h2><p>Deze pc is het speelbord. Verbind beide telefoons met hetzelfde wifi-netwerk en open:</p>
    <div class="lobby"><div class="qr" id="qr"></div><div><div class="url">${remoteInfo.urls[0] || 'geen netwerkadres gevonden'}</div>
    ${remoteInfo.urls.slice(1).map((u) => `<div class="url" style="font-size:12px;opacity:.7">${u}</div>`).join('')}
    <div id="seats"></div></div></div>
    <p style="font-size:12px;color:#8891b0">Iedere speler kiest een held op de eigen telefoon. Een stoel zonder telefoon wordt door de AI gespeeld.</p>
    <div class="btns"><button id="goRemote" data-mode="remote">Start</button><button class="alt" data-reset>Stoelen vrijgeven</button><button class="alt" data-menu>Terug</button></div>`);
  renderSeats(); pushLobby();
  if (remoteInfo.urls[0]) {
    window.qrcode || await new Promise((res) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'; sc.onload = sc.onerror = res; document.head.append(sc); });
    if (window.qrcode && $('qr')) { const q = qrcode(0, 'M'); q.addData(remoteInfo.urls[0]); q.make(); $('qr').innerHTML = q.createSvgTag({ margin: 0, scalable: true }); }
  }
}
function renderSeats() {
  const el = $('seats'); if (!el) return;
  el.innerHTML = remoteSeats.map((s, i) => { const C = CHARACTERS[remoteChars[i]];
    return `<div class="seat ${s.online ? 'on' : ''}" style="color:${PCSS[i]}">Speler ${i + 1} (${i ? 'rood' : 'blauw'}): <span style="color:#eef1ff">${s.online ? '📱 verbonden' : s.taken ? '⚠️ verbinding weg' : 'wacht op telefoon… (anders AI)'}${C ? ` · ${C.icon} ${C.name}` : s.taken ? ' · kiest een held…' : ''}</span></div>`; }).join('');
  const n = remoteSeats.filter((s) => s.taken).length;
  $('goRemote').disabled = n === 0; $('goRemote').textContent = n === 2 ? 'Start: 2 spelers' : n === 1 ? 'Start: telefoon tegen AI' : 'Wacht op een telefoon…';
}
if (REMOTE) {
  $('pipView').src = '/play?mirror=1';
  $('pipView').addEventListener('load', () => { fitPip(); updatePip(); });
  const es = new EventSource('/events?role=display');
  es.addEventListener('seats', (e) => { remoteSeats = JSON.parse(e.data); renderSeats(); if (S?.mode === 'remote') updateUI(); });
  es.addEventListener('cmd', (e) => handleRemote(JSON.parse(e.data)));
  es.addEventListener('joined', () => (S?.mode === 'remote' ? pushRemote() : pushLobby()));
}

resize(); showMenu(); frame();
window.__hg = { get state() { return S; }, guess, cashIn, playCard, useSuper, startGame };
</script>
</body>
