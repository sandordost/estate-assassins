<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Estate Assassins</title>
<style>
  :root {
    --bg: #070a18; --panel: rgba(14, 18, 38, .88); --line: rgba(255, 255, 255, .12);
    --text: #eef1ff; --muted: #9aa3c4; --gold: #e8c25a; --pipw: 330px;
    --p0: #3fa9ff; --p1: #ff5a4f; --p2: #45d483; --p3: #ffc23d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }
  #c { position: absolute; left: 0; top: 64px; width: 100%; height: calc(100% - 260px); display: block; touch-action: none; }
  body.remote #c { height: calc(100% - 64px); }
  body.remote #bottom { display: none; }
  body.remote.pipon #c { width: calc(100% - var(--pipw) - 24px); }

  #top { position: absolute; top: 0; left: 0; right: 0; height: 64px; display: grid;
    grid-template-columns: 1fr minmax(150px, 240px) 1fr; gap: 8px; padding: 6px 10px; background: var(--panel);
    border-bottom: 1px solid var(--line); z-index: 2; }
  .side { display: flex; gap: 6px; min-width: 0; } .side.right { flex-direction: row-reverse; }
  .pinfo { flex: 1; border-radius: 10px; padding: 4px 10px; border: 2px solid color-mix(in srgb, var(--pc) 30%, transparent); min-width: 0; overflow: hidden; }
  .side.right .pinfo { text-align: right; }
  .pinfo .nm { font-weight: 700; color: var(--pc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pinfo .st { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pinfo.active { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 12%, transparent); }
  .pinfo.dead { opacity: .35; text-decoration: line-through; }
  #center { text-align: center; }
  #timer { font-weight: 800; font-size: 20px; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  #timer.low { color: var(--p1); }
  #dombar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #2b3146; margin: 2px 0; }
  #turnlbl { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #msg { position: absolute; top: 72px; left: 50%; transform: translateX(-50%); max-width: min(92vw, 600px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; text-align: center;
    pointer-events: none; z-index: 2; }
  body.remote.pipon #msg { left: calc((100% - var(--pipw) - 24px) / 2); }
  #peek { position: absolute; top: 112px; left: 50%; transform: translateX(-50%); color: var(--gold); font-weight: 700;
    pointer-events: none; text-shadow: 0 1px 4px #000; z-index: 2; }
  .round { position: absolute; right: 10px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--panel); font-weight: 800; z-index: 2; }
  #help { top: 72px; } #mute { top: 112px; }
  body.remote.pipon .round { right: calc(var(--pipw) + 24px); }

  #bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 196px; background: var(--panel);
    border-top: 1px solid var(--line); padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
  #controls { display: flex; gap: 8px; align-items: stretch; justify-content: center; }
  #controls button { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 800; font-size: 16px; min-width: 96px; white-space: nowrap; }
  #bLower, #bHigher { background: #2a3350; }
  #bLower:not(:disabled):hover, #bHigher:not(:disabled):hover { background: #3a4670; }
  #bCash { background: linear-gradient(#f2d06e, #c99a2c); color: #2a1b00; }
  #bSuper { background: linear-gradient(135deg, var(--sc, #b07cff), #2a3350); }
  #bCancel { background: #533; display: none; }
  #controls button:disabled { opacity: .35; cursor: default; }
  #tokens { align-self: center; color: var(--gold); font-weight: 800; min-width: 70px; text-align: center; }
  #hand { flex: 1; display: flex; gap: 8px; overflow-x: auto; justify-content: center; padding-bottom: 2px; }
  .hcard { flex: 0 0 116px; border: 2px solid var(--gold); border-radius: 10px; padding: 6px; text-align: center; overflow: hidden;
    background: linear-gradient(#2a1650, #120a2a); display: flex; flex-direction: column; gap: 2px; transition: transform .15s; }
  .hcard:not(:disabled):hover { transform: translateY(-4px); }
  .hcard:disabled { opacity: .45; cursor: default; }
  .hcard .ic { font-size: 24px; line-height: 1.1; }
  .hcard b { font-size: 12px; } .hcard small { font-size: 10.5px; color: #c9c2e6; line-height: 1.2;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .empty { color: var(--muted); align-self: center; text-align: center; font-size: 12px; }

  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(4, 6, 16, .78); backdrop-filter: blur(5px); z-index: 10; padding: 16px; }
  #overlay.hidden { display: none; }
  .box { background: #10162e; border: 1px solid var(--line); border-radius: 18px; padding: 22px; max-width: 640px;
    width: 100%; max-height: 100%; overflow: auto; box-shadow: 0 20px 80px rgba(0,0,0,.6); }
  .box h1 { margin: 0; font-size: 36px; letter-spacing: 3px; background: linear-gradient(90deg, var(--p0), var(--gold), var(--p1));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .box h2 { margin: 0 0 8px; }
  .box p { color: #c8cee6; } .box ul { padding-left: 18px; color: #c8cee6; } .box li { margin: 4px 0; }
  .box .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .box .btns button { flex: 1; border: 0; border-radius: 12px; padding: 12px; font-weight: 800; font-size: 15px;
    background: linear-gradient(#f2d06e, #c99a2c); color: #2a1b00; min-width: 160px; }
  .box .btns button.alt { background: #2a3350; color: var(--text); }
  .box .btns button:disabled { opacity: .4; }
  .count { display: flex; gap: 8px; align-items: center; margin: 10px 0 0; }
  .count button { border: 2px solid var(--line); background: #1b2442; border-radius: 10px; padding: 8px 16px; font-weight: 800; }
  .count button.on { border-color: var(--gold); color: var(--gold); }
  .heroes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
  .hero { border-radius: 14px; padding: 12px 10px; text-align: left; background: #1b2442; border: 2px solid var(--hc);
    display: flex; flex-direction: column; gap: 4px; transition: transform .15s; color: var(--text); }
  .hero:not(:disabled):hover { transform: translateY(-3px); box-shadow: 0 6px 24px color-mix(in srgb, var(--hc) 40%, transparent); }
  .hero:disabled { opacity: .3; }
  .hero .hi { font-size: 40px; line-height: 1; text-align: center; filter: drop-shadow(0 0 10px var(--hc)); }
  .hero .hn { font-weight: 900; font-size: 18px; color: var(--hc); text-align: center; }
  .hero .ht { font-size: 12px; color: var(--muted); text-align: center; margin-top: -4px; }
  .hero .hp { font-size: 12px; } .hero .hs { font-size: 12px; color: #f2d06e; }
  .lobby { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; margin-top: 10px; }
  .lobby .qr { background: #fff; padding: 8px; border-radius: 10px; width: 176px; height: 176px; }
  .lobby .qr svg { width: 100%; height: 100%; display: block; }
  .lobby .url { font: 700 15px ui-monospace, monospace; color: var(--gold); word-break: break-all; }
  .seat { padding: 6px 10px; border-radius: 8px; background: #1b2442; margin: 6px 0; color: var(--pc); }
  .seat.on { box-shadow: inset 4px 0 0 var(--pc); } .seat.off { opacity: .35; }
  .seat span { color: var(--text); }

  #pip { position: absolute; right: 12px; top: 76px; bottom: 12px; width: var(--pipw); display: none; flex-direction: column; gap: 6px; z-index: 5; }
  body.remote.pipon #pip { display: flex; }
  #pip .lbl { font-weight: 800; text-align: center; color: var(--pc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pip .frame { flex: 1; border-radius: 30px; border: 5px solid var(--pc); background: #0b1020; overflow: hidden; position: relative;
    box-shadow: 0 0 34px color-mix(in srgb, var(--pc) 45%, transparent); transition: border-color .3s, box-shadow .3s; }
  #pip iframe { position: absolute; left: 0; top: 0; width: 390px; border: 0; transform-origin: 0 0; pointer-events: none; }

  #banner { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 32px; font-weight: 900;
    text-shadow: 0 2px 16px #000, 0 0 30px currentColor; pointer-events: none; opacity: 0; transition: opacity .25s; white-space: nowrap; z-index: 6; }
  .float { position: absolute; transform: translate(-50%, -50%); font-weight: 900; font-size: 22px; pointer-events: none;
    text-shadow: 0 2px 8px #000; white-space: nowrap; z-index: 4; }
  #tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 4px 8px; font-size: 12px; display: none; z-index: 7; max-width: 280px; }

  @media (max-width: 900px) { :root { --pipw: 210px; } .heroes { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) {
    #top { grid-template-columns: 1fr 104px 1fr; padding: 4px 6px; gap: 4px; }
    .side { flex-direction: column; gap: 2px; } .side.right { flex-direction: column; }
    .pinfo { padding: 0 6px; border-width: 1px; } .pinfo .st { display: none; } .pinfo .nm { font-size: 12px; }
    #timer { font-size: 16px; }
    #controls { gap: 6px; } #controls button { padding: 10px 8px; min-width: 0; flex: 1; font-size: 14px; }
    .hcard { flex-basis: 92px; padding: 4px; } .hcard .ic { font-size: 20px; } .hcard small { font-size: 9.5px; }
    #tokens { min-width: 34px; font-size: 13px; }
    #msg { border-radius: 12px; font-size: 12.5px; padding: 5px 10px; top: 68px; }
    .box h1 { font-size: 28px; } .heroes { grid-template-columns: 1fr; } .hero .hi { font-size: 30px; }
    .lobby { grid-template-columns: 1fr; }
  }
</style>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<canvas id="c"></canvas>
<div id="top">
  <div class="side" id="leftSide"></div>
  <div id="center"><div id="timer">10:00</div><div id="dombar"></div><div id="turnlbl"></div></div>
  <div class="side right" id="rightSide"></div>
</div>
<div id="msg">Welcome to Estate Assassins</div>
<div id="peek"></div>
<button id="help" class="round" title="Rules">?</button>
<button id="mute" class="round" title="Sound on/off">🔊</button>
<div id="bottom">
  <div id="controls">
    <button id="bLower">▼ Lower</button>
    <div id="tokens"></div>
    <button id="bHigher">▲ Higher</button>
    <button id="bCash">Claim</button>
    <button id="bSuper">Super</button>
    <button id="bCancel">Cancel</button>
  </div>
  <div id="hand"></div>
</div>
<div id="pip"><div class="lbl" id="pipLbl"></div><div class="frame" id="pipFrame"><iframe id="pipView" title="Phone of the active player" tabindex="-1"></iframe></div></div>
<div id="banner"></div>
<div id="tip"></div>
<div id="overlay"></div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---------- constants ----------
const $ = (id) => document.getElementById(id);
const VERSION = '1.0.0';
const N = 6, SP = 1.12, HAND_MAX = 5, ROUND_SECONDS = 600, MAX_PLAYERS = 4;
const DOM_WIN = { 2: .6, 3: .5, 4: .45 };
const PCSS = ['#3fa9ff', '#ff5a4f', '#45d483', '#ffc23d'];
const PCOL = PCSS.map((c) => new THREE.Color(c));
const COLOR_NAMES = ['Blue', 'Red', 'Green', 'Gold'];
// HQ corners per seat: bottom-left, top-right, top-left, bottom-right (opposite seats first).
const HQ_POS = [[5, 0], [0, 5], [0, 0], [5, 5]];
const SUITS = ['♠', '♥', '♦', '♣'];
const rankLabel = (r) => ({ 11: 'J', 12: 'Q', 13: 'K', 14: 'A' })[r] || String(r);
const cardLabel = (c) => rankLabel(c.rank) + SUITS[c.suit];
const OBSTACLES = { mountain: 'Mountain', lake: 'Lake', crystal: 'Crystal field', wall: 'Barricade' };
const BUILDINGS = { house: 'House', shop: 'Shop', tower: 'Tower', ruin: 'Ruined keep' };

// Four heroes: a card duelist (Yu-Gi-Oh inspired), a ki warrior (Dragon Ball inspired), a seer and a dragon tamer.
const CHARACTERS = {
  duelist: { name: 'Kaito', title: 'The Duelist', icon: '🃏', color: '#b07cff', glow: 0xb07cff,
    passive: 'Starts with 2 action cards and may hold 6.', superName: 'Card Storm', superIcon: '🌠',
    superText: 'Instantly draw the next 2 action cards from the deck.', shout: 'My turn! Card Storm!' },
  warrior: { name: 'Raiden', title: 'The Ki Warrior', icon: '🔥', color: '#ffb02e', glow: 0xffa020,
    passive: 'Power-up: from your 3rd correct guess in a turn, every correct guess gives +1 extra claim.', superName: 'Ki Blast', superIcon: '💥',
    superText: 'Your next coin flip is guaranteed heads, even against sabotage.', shout: 'Ki Blast… UNLEASHED!' },
  seer: { name: 'Mira', title: 'The Seer', icon: '👁️', color: '#4fe3c1', glow: 0x4fe3c1,
    passive: 'An equal card always counts as a correct guess.', superName: 'Third Eye', superIcon: '🔮',
    superText: 'See the next 2 playing cards of the deck.', shout: 'I see what is coming…' },
  dragon: { name: 'Zara', title: 'The Dragon Tamer', icon: '🐉', color: '#ff4fa3', glow: 0xff4fa3,
    passive: 'Flies over obstacles: tiles on the far side of an obstacle count as adjacent.', superName: 'Dragon Breath', superIcon: '🌋',
    superText: 'Burn away every obstacle next to your territory; they become neutral land.', shout: 'Awaken, dragon!' },
};
const CHAR_IDS = Object.keys(CHARACTERS);
const handMax = (p) => p.char === 'duelist' ? HAND_MAX + 1 : HAND_MAX;

// 30 action cards in the double deck (Yu-Gi-Oh/Magic style: drawn into your hand, played on your turn).
const ACTIONS = {
  lucky:     { name: 'Golden Coin',    icon: '🪙', count: 2, text: 'Your next coin flip is guaranteed heads.' },
  peek:      { name: 'Spyglass',       icon: '🔭', count: 2, text: 'Look at the next playing card before you guess.' },
  double:    { name: 'Double or Nothing', icon: '⚡', count: 2, text: 'Your next correct guess gives 2 claims.' },
  second:    { name: 'Second Chance',  icon: '🍀', count: 2, text: 'Your next wrong guess this turn does not count.' },
  shield:    { name: 'Shield',         icon: '🛡️', count: 2, target: 'own', text: 'Protect one of your tiles from claims for 2 rounds.' },
  equal:     { name: 'Stalemate',      icon: '⚖️', count: 1, text: 'This turn an equal card counts as correct.' },
  sabotage:  { name: 'Sabotage',       icon: '💣', count: 1, text: 'The next coin flip of the strongest rival fails.' },
  quake:     { name: 'Earthquake',     icon: '💢', count: 1, text: 'A random rival tile (not an HQ) turns neutral.' },
  swap:      { name: 'Swap',           icon: '🔄', count: 1, text: 'Replace the open card with a new one.' },
  takeover:  { name: 'Hostile Takeover', icon: '🏗️', count: 1, target: 'claim', text: 'Claim an adjacent tile without a coin flip (not an HQ).' },
  bridge:    { name: 'Bridge',         icon: '🌉', count: 2, target: 'bridge', text: 'Claim a tile on the far side of an obstacle, no coin flip (not an HQ).' },
  demolish:  { name: 'Demolition',     icon: '🧨', count: 2, target: 'obstacleAdj', text: 'Blow up an obstacle next to your territory: it becomes neutral land.' },
  wall:      { name: 'Barricade',      icon: '🧱', count: 2, target: 'neutral', text: 'Build a wall on a neutral tile. Nobody can pass it.' },
  portal:    { name: 'Portal',         icon: '🌀', count: 1, target: 'portal', text: 'Claim a neutral tile next to any obstacle on the map, no coin flip.' },
  avalanche: { name: 'Avalanche',      icon: '🏔️', count: 1, text: 'Up to 2 rival tiles next to an obstacle turn neutral.' },
  greed:     { name: 'Greed',          icon: '💰', count: 2, text: 'Gain +1 claim right now (lost on a wrong guess).' },
  reroll:    { name: 'Reroll',         icon: '🎲', count: 2, text: 'If your next coin flip fails, flip again for free.' },
  steal:     { name: 'Pickpocket',     icon: '🦝', count: 1, text: 'Steal a random action card from the rival with the most cards.' },
  fortify:   { name: 'Fortress',       icon: '🏰', count: 1, target: 'ownLand', text: 'One of your tiles now needs 2× heads to be taken.' },
  ambush:    { name: 'Ambush',         icon: '🕸️', count: 1, target: 'ownTrap', text: 'Hide a trap on your tile: the next attack on it fails automatically.' },
};
const ACTION_TOTAL = Object.values(ACTIONS).reduce((s, a) => s + a.count, 0);

// ---------- helpers ----------
// Test hooks: ?speed=N runs the game N× faster, ?autoplay lets the AI play every seat, ?players=N sets the AI-mode size.
const params = new URLSearchParams(location.search);
const REMOTE = location.protocol.startsWith('http') && !params.has('noremote');
const SPEED = Math.max(1, Number(params.get('speed')) || 1), AUTOPLAY = params.has('autoplay');
const LOW_GFX = params.has('lowgfx');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms / SPEED));
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a) => a[Math.random() * a.length | 0];
const easeInOut = (k) => k < .5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
const tweens = [];
const tween = (dur, fn, ease = easeInOut) => new Promise((res) => tweens.push({ t: 0, dur, fn, ease, res }));
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur);
    tw.fn(tw.ease(k)); if (k >= 1) { tweens.splice(i, 1); tw.res(); }
  }
}

const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch { /* storage blocked */ } } };
// ---------- sound: everything is synthesised with WebAudio, no audio files ----------
const SFX = (() => {
  let ctx = null, master = null, sfxBus = null, musicBus = null, noiseBuf = null, musicOn = false;
  let muted = store.get('hg-muted') === '1';
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = .9; sfxBus.connect(master);
    musicBus = ctx.createGain(); musicBus.gain.value = .0; musicBus.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(f, t, dur, { type = 'sine', vol = .08, to, attack = .006, bus = sfxBus } = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(bus); o.start(t); o.stop(t + dur + .05);
  }
  function noise(t, dur, { vol = .1, freq = 2000, to, q = 1, type = 'bandpass', attack = .004 } = {}) {
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf; f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(freq, t); if (to) f.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(f).connect(g).connect(sfxBus); src.start(t); src.stop(t + dur + .05);
  }
  const arp = (t, notes, step, opts) => notes.forEach((f, i) => tone(f, t + i * step, opts?.dur ?? .25, opts));
  const S_ = {
    click: (t) => tone(1200, t, .04, { type: 'square', vol: .03 }),
    start: (t) => { arp(t, [262, 330, 392, 523], .09, { type: 'triangle', vol: .07, dur: .35 }); noise(t, .6, { freq: 6000, to: 1500, vol: .04 }); },
    turn: (t) => { tone(660, t, .18, { type: 'sine', vol: .06 }); tone(990, t + .09, .3, { type: 'sine', vol: .05 }); },
    deal: (t) => { noise(t, .09, { freq: 4500, to: 1800, vol: .14, q: .8 }); tone(180, t + .05, .06, { type: 'triangle', vol: .05 }); },
    flip: (t) => { noise(t, .07, { freq: 5000, to: 2500, vol: .12 }); noise(t + .1, .06, { freq: 3000, to: 1200, vol: .1 }); },

function domeMaterial(color) {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    uniforms: { uTime: U.uTime, uColor: { value: new THREE.Color(color) }, uOpen: { value: 0 } },

      void main(){

        vec2 p = vec2(atan(vP.z, vP.x) * 3.0, vP.y * 10.);

// ---------- map generation ----------
// One 3×3 quadrant is generated and rotated four times, so every corner gets the same map: random, yet fair.
const rot = (r, c) => [c, N - 1 - r]; // 90° clockwise
function genMap(nPlayers) {
  for (let attempt = 0; attempt < 400; attempt++) {
    const q = [];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) q.push({ r, c, kind: 'land', value: pick([1, 1, 2, 2, 3]) });
    const Q = (r, c) => q[r * 3 + c];
    Q(0, 0).kind = 'hq'; Q(2, 2).value = 3;
    const bc = pick([[0, 2], [1, 2], [0, 2]]); Object.assign(Q(...bc), { kind: 'beacon', value: 3 });
    const cand = shuffle([[1, 1], [2, 2], [2, 1], [1, 2], [2, 0], [0, 2]].filter(([r, c]) => Q(r, c).kind === 'land'));
    const nObs = pick([1, 2, 2]), obsType = pick(['mountain', 'lake', 'crystal']);
    for (let i = 0; i < nObs; i++) { const t = Q(...cand[i]); t.kind = 'obstacle'; t.obs = i ? pick(['mountain', 'lake', 'crystal']) : obsType; }
    const grid = new Array(N * N);
    for (const cell of q) {
      let [r, c] = [cell.r, cell.c];
      for (let k = 0; k < 4; k++) { grid[r * N + c] = { ...cell, r, c }; [r, c] = rot(r, c); }
    }
    // seat of each HQ corner; unused corners become ruined keeps
    for (const t of grid) {
      if (t.kind !== 'hq') continue;
      const seat = HQ_POS.findIndex(([r, c]) => r === t.r && c === t.c);
      if (seat < nPlayers) { t.seat = seat; t.value = 3; } else { t.kind = 'land'; t.value = 3; t.ruin = true; }
    }
    if (connected(grid)) return grid.map((t, i) => ({ ...t, i }));
  }
  throw new Error('map generation failed');
}
// Every HQ and beacon must reach every other through passable tiles.
function connected(grid, extraBlock = -1) {
  const pass = (i) => grid[i].kind !== 'obstacle' && i !== extraBlock;
  const goals = grid.map((t, i) => i).filter((i) => grid[i].kind === 'hq' || grid[i].kind === 'beacon');
  if (!goals.length) return true;
  const seen = new Set([goals[0]]), queue = [goals[0]];
  while (queue.length) {
    const i = queue.shift(), r = i / N | 0, c = i % N;
    for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const rr = r + dr, cc = c + dc, j = rr * N + cc;
      if (rr < 0 || cc < 0 || rr >= N || cc >= N || seen.has(j) || !pass(j)) continue;
      seen.add(j); queue.push(j);
    }
  }
  return goals.every((i) => seen.has(i));
}

function buildBoard() {

const tileAt = (r, c) => S.tiles[r * N + c];

// ---------- action cards ----------
function cardTargets(pi, kind) {
  const own = S.tiles.filter((t) => t.owner === pi);
  switch (kind) {
    case 'own': return own.filter((t) => t.shield === 0);
    case 'ownTrap': return own.filter((t) => t.trap < 0);
    case 'ownLand': return own.filter((t) => t.kind !== 'hq' && !t.fort);
    case 'claim': return claimTargets(pi).filter((t) => t.kind !== 'hq');
    case 'obstacleAdj': return S.tiles.filter((t) => t.kind === 'obstacle' && neighbors(t).some((n) => n.owner === pi));
    case 'neutral': return S.tiles.filter((t) => t.kind === 'land' && t.owner < 0 && connected(S.tiles, t.i));
    case 'bridge': return S.tiles.filter((t) => passable(t) && t.kind !== 'hq' && t.owner !== pi && t.shield === 0 && acrossObstacle(pi, t));
    case 'portal': return S.tiles.filter((t) => t.kind === 'land' && t.owner < 0 && neighbors(t).some((n) => n.kind === 'obstacle'));

}
const avalancheTargets = (pi) => S.tiles.filter((t) => t.owner >= 0 && t.owner !== pi && t.kind !== 'hq' && t.shield === 0 && neighbors(t).some((n) => n.kind === 'obstacle'));

    case 'equal': p.equal = true; break;

    case 'fortify': target.fort = true; SFX.play('shield'); floatText('🏰 Fortress', target.pos.clone().add(new THREE.Vector3(0, 1, 0)), '#f2d06e'); break;
    case 'ambush': target.trap = pi; SFX.play('trap'); break;

    case 'wall': SFX.play('wall'); await transform(target, 'obstacle', { obs: 'wall', owner: -1 }); break;
    case 'quake': {

}

    a.needsUpdate = true;
  }
  if (S) {
    for (const t of S.tiles) {
      const u = t.glow.material.uniforms;
      u.uPulse.value = S.targets.includes(t) ? 1 : 0;
      u.uTouch.value = t.touchT != null && elapsed - t.touchT < .6 ? 1 - (elapsed - t.touchT) / .6 : 0;
      t.group.position.y = S.targets.includes(t) ? .03 + Math.sin(elapsed * 6) * .02 : 0;
      if (t.shield) t.dome.material.opacity = .2 + Math.sin(elapsed * 3) * .06;
    }
    heroSprites.forEach((sp, i) => {
      const p = S.players[i], active = S.cur === i && !S.over;
      sp.position.y = sp.userData.base + (active ? Math.sin(elapsed * 3) * .1 : 0);
      sp.material.opacity = !p.alive ? .2 : active || !S.started ? 1 : .55;
    });
    if (S.started && !S.over) {
      S.timeLeft -= dt;
      const sec = Math.ceil(S.timeLeft);
      if (sec !== lastSec) { lastSec = sec; if (sec <= 10 && sec > 0) SFX.play('tick'); }
      if ((uiTick += dt) > .25) { uiTick = 0; if ((remoteTick += .25) >= 1) { remoteTick = 0; pushRemote(); }
        $('timer').textContent = `${Math.floor(Math.max(0, S.timeLeft) / 60)}:${String(Math.floor(Math.max(0, S.timeLeft) % 60)).padStart(2, '0')}`; $('timer').classList.toggle('low', S.timeLeft < 60); }
      if (S.timeLeft <= 0) timeUp();
    }
  }
  composer.render();
}
function frame() { step(); requestAnimationFrame(frame); }
setInterval(() => { if (performance.now() - lastStep > 200) step(); }, 100);

// ---------- phones as controllers (server.mjs) ----------
let remoteSeats = Array.from({ length: MAX_PLAYERS }, () => ({ taken: false, online: false }));
let remoteChars = [null, null, null, null], remoteCount = 2;
function remoteState(seat) {
  if (!S || seat >= S.n) return { lobby: true, seat, chars: remoteChars, count: remoteCount, heroes: heroList() };
  const p = S.players[seat], mine = S.cur === seat && !S.over && !p.ai;
  return {
    seat, n: S.n, name: p.name, alive: p.alive, cur: S.cur, curName: S.players[S.cur].name, myTurn: mine, phase: S.phase,
    card: S.current && { label: cardLabel(S.current), red: S.current.suit === 1 || S.current.suit === 2 },
    tokens: S.tokens, claims: S.claims, msg: $('msg').textContent, peek: mine && S.peek ? cardLabel(S.peek) + (S.peek2 ? ` · then ${cardLabel(S.peek2)}` : '') : '',
    hand: p.hand.map((c) => ({ id: c.id, name: ACTIONS[c.id].name, icon: ACTIONS[c.id].icon, text: ACTIONS[c.id].text,
      playable: mine && S.phase === 'guess' && canPlay(seat, c.id) })),
    tiles: S.tiles.map((t) => ({ k: t.kind, o: t.owner, v: t.value, ob: t.obs, b: t.bType, s: t.shield, f: t.fort, tr: t.trap === seat, t: mine && S.targets.includes(t) })),
    players: S.players.map((x) => ({ name: x.name, icon: CHARACTERS[x.char].icon, alive: x.alive, beacons: beaconCount(x.i) })),
    beaconsNeeded: beaconsNeeded(), canAttack: canAttackHQ(seat),
    canGuess: mine && S.phase === 'guess', canCash: mine && S.phase === 'guess' && S.tokens > 0, canCancel: mine && S.phase === 'target',
    timeLeft: Math.max(0, Math.round(S.timeLeft)), dom: dominance().map((x) => Math.round(x * 100)), status: statusIcons(p),
    over: S.over, result: S.result || null,
    hero: { id: p.char, ...CHARACTERS[p.char], glow: undefined }, superUsed: p.superUsed, canSuper: mine && canSuper(seat),
  };
}
const heroList = () => CHAR_IDS.map((id) => ({ id, ...CHARACTERS[id], glow: undefined }));
let pushTimer = null;
function pushRemote() {
  if (!REMOTE || S?.mode !== 'remote' || pushTimer) return;
  pushTimer = setTimeout(() => {
    pushTimer = null;
    if (S?.mode !== 'remote') return;
    fetch('/state', { method: 'POST', body: JSON.stringify({ seats: [0, 1, 2, 3].map(remoteState) }) }).catch(() => {});
    updatePip();
  }, 40);
}
function pushLobby() {
  if (!REMOTE) return;
  fetch('/state', { method: 'POST', body: JSON.stringify({ seats: [0, 1, 2, 3].map((seat) => ({ lobby: true, seat, chars: remoteChars, count: remoteCount, heroes: heroList() })) }) }).catch(() => {});
}
// Picture-in-picture: a read-only copy of the active player's phone, fed with the same state the phone gets.
function updatePip() {
  const on = !!(S && S.mode === 'remote' && !S.over && S.started && !S.players[S.cur].ai && remoteSeats[S.cur].taken);
  if (document.body.classList.contains('pipon') !== on) { document.body.classList.toggle('pipon', on); resize(); }
  if (!on) return;
  const p = S.players[S.cur], C = CHARACTERS[p.char];
  $('pip').style.setProperty('--pc', PCSS[S.cur]);
  $('pipLbl').textContent = `📱 ${C.icon} ${p.name}'s phone`;
  $('pipView').contentWindow?.postMessage({ type: 'state', seat: S.cur, state: remoteState(S.cur) }, location.origin);
}
function fitPip() {
  const f = $('pipFrame'), v = $('pipView'); if (!f.clientWidth) return;
  const k = f.clientWidth / 390;
  v.style.transform = `scale(${k})`; v.style.height = f.clientHeight / k + 'px';
}
function handleRemote(c) {
  if (c.a === 'touch') {
    if (S?.mode !== 'remote' || S.over || c.seat !== S.cur) return;
    $('pipView').contentWindow?.postMessage({ type: 'touch', k: String(c.k) }, location.origin);
    const m = /^tile:(\d+)$/.exec(String(c.k)); if (m && S.tiles[+m[1]]) S.tiles[+m[1]].touchT = elapsed;
    return;
  }
  if (c.a === 'restart') { if (S?.mode === 'remote' && S.over) startGame('remote', S.n); return; }
  if (c.a === 'char') {
    if (S?.mode === 'remote' && !S.over) return;
    if (CHARACTERS[c.hero] && !remoteChars.some((x, i) => x === c.hero && i !== c.seat)) {
      remoteChars[c.seat] = c.hero; SFX.play('super_' + c.hero); renderSeats(); pushLobby();
    }
    return;
  }
  if (!S || S.over || S.mode !== 'remote' || c.seat !== S.cur || S.players[c.seat].ai) return;
  if (c.a === 'guess') guess(c.dir === 'lower' ? 'lower' : 'higher');
  else if (c.a === 'cash') cashIn();
  else if (c.a === 'play') playCard(c.seat, c.idx | 0);
  else if (c.a === 'cancel') cancelTarget();
  else if (c.a === 'super') useSuper(c.seat);
  else if (c.a === 'tile') chooseTile(S.tiles[c.i | 0]);
}
let remoteInfo = { urls: [] };
async function showLobby() {
  remoteCount = menuCount;
  try { remoteInfo = await (await fetch('/info')).json(); } catch { /* server unreachable: lobby shows no address */ }
  showOverlay(`<h2>Play with phones</h2><p>This PC is the board. Connect every phone to the same Wi-Fi and open:</p>
    <div class="lobby"><div class="qr" id="qr"></div><div><div class="url">${remoteInfo.urls[0] || 'no network address found'}</div>
    ${remoteInfo.urls.slice(1).map((u) => `<div class="url" style="font-size:12px;opacity:.7">${u}</div>`).join('')}
    ${countPicker()}<div id="seats"></div></div></div>
    <p style="font-size:12px;color:#8891b0">Every player picks a colour and hero on their own phone. Seats without a phone are played by the AI.</p>
    <div class="btns"><button id="goRemote" data-mode="remote">Start</button><button class="alt" data-reset>Free all seats</button><button class="alt" data-menu>Back</button></div>`);
  renderSeats(); pushLobby();
  if (remoteInfo.urls[0]) {
    window.qrcode || await new Promise((res) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'; sc.onload = sc.onerror = res; document.head.append(sc); });
    if (window.qrcode && $('qr')) { const q = qrcode(0, 'M'); q.addData(remoteInfo.urls[0]); q.make(); $('qr').innerHTML = q.createSvgTag({ margin: 0, scalable: true }); }
  }
}
function renderSeats() {
  const el = $('seats'); if (!el) return;
  el.innerHTML = remoteSeats.map((s, i) => { const C = CHARACTERS[remoteChars[i]], used = i < remoteCount;
    return `<div class="seat ${s.online ? 'on' : ''} ${used ? '' : 'off'}" style="--pc:${PCSS[i]}">${COLOR_NAMES[i]}: <span>${!used ? 'not in this game' : s.online ? '📱 connected' : s.taken ? '⚠️ connection lost' : 'waiting for a phone… (else AI)'}${C ? ` · ${C.icon} ${C.name}` : s.taken && used ? ' · choosing a hero…' : ''}</span></div>`; }).join('');
  const humans = remoteSeats.slice(0, remoteCount).filter((s) => s.taken).length;
  $('goRemote').disabled = humans === 0;
  $('goRemote').textContent = humans ? `Start: ${humans} phone${humans > 1 ? 's' : ''}${humans < remoteCount ? ` + ${remoteCount - humans} AI` : ''}` : 'Waiting for a phone…';
}
if (REMOTE) {
  $('pipView').src = '/play?mirror=1';
  $('pipView').addEventListener('load', () => { fitPip(); updatePip(); });
  const es = new EventSource('/events?role=display');
  es.addEventListener('seats', (e) => { const s = JSON.parse(e.data); remoteSeats = Array.from({ length: MAX_PLAYERS }, (_, i) => s[i] || { taken: false, online: false }); renderSeats(); if (S?.mode === 'remote') updateUI(); });
  es.addEventListener('cmd', (e) => handleRemote(JSON.parse(e.data)));
  es.addEventListener('joined', () => (S?.mode === 'remote' ? pushRemote() : pushLobby()));
}

resize(); showMenu(); frame();
window.__hg = { get state() { return S; }, guess, cashIn, playCard, useSuper, startGame };
</script>
