<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070a18">
<title>Estate Assassins controller</title>
<style>
  :root { --bg: #070a18; --panel: #121a33; --line: rgba(255,255,255,.12); --text: #eef1ff; --muted: #9aa3c4;
    --gold: #e8c25a; --me: #3fa9ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  button:disabled { opacity: .35; cursor: default; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 10px 12px calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
  .hidden { display: none !important; }

  header { display: flex; align-items: center; gap: 10px; }
  header .me { font-weight: 800; color: var(--me); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .time { font-weight: 800; font-variant-numeric: tabular-nums; }
  header .time.low { color: #ff5a4f; }
  .dom { display: flex; height: 7px; border-radius: 4px; overflow: hidden; background: #2b3146; }
  .rivals { display: flex; gap: 6px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: -4px; }
  .rivals span { padding: 1px 6px; border-radius: 6px; border: 1px solid; }
  .rivals .out { opacity: .4; text-decoration: line-through; }

  .turn { text-align: center; font-weight: 900; font-size: 20px; padding: 8px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
  .turn.mine { background: var(--me); color: #071022; border-color: transparent; animation: glow 1.6s ease-in-out infinite; }
  @keyframes glow { 50% { filter: brightness(1.15); } }
  .msg { text-align: center; color: #c8cee6; min-height: 2.7em; font-size: 14px; }
  .heroline { font-size: 12px; color: var(--muted); text-align: center; }

  .table { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .card { width: 74px; height: 104px; border-radius: 9px; background: #fbf8f0; color: #15161c; display: flex; align-items: center;
    justify-content: center; font: 800 28px Georgia, serif; box-shadow: 0 4px 14px rgba(0,0,0,.5); }
  .card.red { color: #c8202f; }
  .tokens { color: var(--gold); font-weight: 900; font-size: 20px; text-align: center; min-width: 80px; }
  .tokens small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
  .peek { text-align: center; color: var(--gold); font-weight: 800; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions button { padding: 16px 8px; border-radius: 14px; font-weight: 900; font-size: 20px; background: #2a3350; }
  .actions .cash { grid-column: 1 / -1; background: linear-gradient(#f2d06e, #c99a2c); color: #2a1b00; font-size: 17px; padding: 14px; }
  .actions .super { grid-column: 1 / -1; background: linear-gradient(135deg, var(--hc, #b07cff), #2a3350); font-size: 15px; padding: 12px; }
  .actions .cancel { grid-column: 1 / -1; background: #533; font-size: 15px; padding: 12px; }

  h3 { margin: 4px 0 -4px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; width: min(100%, 320px); margin: 0 auto; }
  .tile { aspect-ratio: 1; border-radius: 6px; background: #2b3142; display: flex; align-items: center; justify-content: center;
    font-size: 17px; position: relative; border: 2px solid transparent; padding: 0; }
  .tile:disabled { opacity: 1; }
  .tile.obs { background: #1a1d28; }
  .tile .v { position: absolute; right: 2px; bottom: 0; font-size: 9px; font-weight: 800; color: rgba(255,255,255,.75); }
  .tile .mk { position: absolute; left: 1px; top: -1px; font-size: 10px; }
  .tile.t { border-color: var(--gold); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 3px rgba(232,194,90,.45); } }
  .legend { font-size: 11px; color: var(--muted); text-align: center; }

  .hand { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .hcard { border: 2px solid var(--gold); border-radius: 12px; padding: 8px; text-align: left; background: linear-gradient(#2a1650, #120a2a);
    display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: center; }
  .hcard .ic { font-size: 26px; grid-row: span 2; }
  .hcard b { font-size: 13px; } .hcard small { font-size: 11px; color: #c9c2e6; grid-column: 2; }
  .hcard.back { background: repeating-linear-gradient(45deg, #142a5c 0 8px, #1b3570 8px 16px); }
  .empty { color: var(--muted); font-size: 13px; text-align: center; }

  .join { text-align: center; padding-top: 5vh; }
  .join h1 { font-size: 28px; letter-spacing: 2px; margin: 0 0 4px; background: linear-gradient(90deg, #3fa9ff, var(--gold), #ff5a4f);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .seatbtn { display: block; width: 100%; padding: 16px; border-radius: 14px; font-weight: 900; font-size: 18px; margin: 10px 0; color: #071022; }
  .heroes { display: flex; flex-direction: column; gap: 8px; }
  .hero { border-radius: 14px; padding: 10px 12px; text-align: left; background: #1b2442; border: 2px solid var(--hc);
    display: grid; grid-template-columns: 52px 1fr; gap: 2px 10px; align-items: center; }
  .hero.sel { background: color-mix(in srgb, var(--hc) 28%, #1b2442); box-shadow: 0 0 0 3px var(--hc); }
  .hero .hi { font-size: 38px; grid-row: span 3; text-align: center; filter: drop-shadow(0 0 8px var(--hc)); }
  .hero .hn { font-weight: 900; color: var(--hc); } .hero .hn small { color: var(--muted); font-weight: 600; }
  .hero .hp, .hero .hs { font-size: 12px; } .hero .hs { color: #f2d06e; }
  .result { text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .result h2 { margin: 0 0 6px; }
  .result button { margin-top: 10px; width: 100%; padding: 14px; border-radius: 12px; font-weight: 900; background: linear-gradient(#f2d06e, #c99a2c); color: #2a1b00; }
  .foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
  .foot button { background: none; color: var(--muted); text-decoration: underline; padding: 4px; }
  .conn { font-size: 12px; text-align: center; color: #ff5a4f; }
  /* Mirror: read-only copy shown picture-in-picture on the PC */
  .mirror button { pointer-events: none; }
  .mirror .foot { display: none; }
  .pressed { transform: scale(.94); filter: brightness(1.35); transition: transform .08s, filter .08s; }
  .tap { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; pointer-events: none; z-index: 50;
    background: rgba(255,255,255,.55); border: 3px solid #fff; box-shadow: 0 0 18px rgba(255,255,255,.8); animation: tap .7s ease-out forwards; }
  @keyframes tap { 0% { transform: scale(.4); opacity: 1; } 60% { opacity: .9; } 100% { transform: scale(2.2); opacity: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <section id="join" class="join">
    <h1>ESTATE ASSASSINS</h1>
    <p style="color:var(--muted)">Pick your colour. The PC shows the board, you play here.</p>
    <div id="seatBtns"></div>
    <p id="joinNote" class="empty"></p>
  </section>

  <section id="game" class="hidden">
    <header><div class="me" id="me"></div><div id="status"></div><div class="time" id="time">10:00</div></header>
    <div class="dom" id="dom"></div>
    <div class="rivals" id="rivals"></div>
    <div class="conn hidden" id="conn">Lost connection to the PC, reconnecting…</div>
    <div class="turn" id="turn">Waiting for the game to start…</div>
    <div id="heroPick" class="hidden"><h3 style="margin-bottom:8px">Choose your hero</h3><div class="heroes" id="heroes"></div></div>
    <div class="heroline" id="heroLine"></div>
    <div class="result hidden" id="result"></div>
    <div id="ingame">
      <div class="msg" id="msg"></div>
      <div class="table">
        <div class="card" id="card">?</div>
        <div class="tokens" id="tokens">0<small>claims</small></div>
      </div>
      <div class="peek" id="peek"></div>
      <div class="actions">
        <button id="bLower" data-k="lower">▼ Lower</button>
        <button id="bHigher" data-k="higher">▲ Higher</button>
        <button class="cash" id="bCash" data-k="cash">Claim property</button>
        <button class="super hidden" id="bSuper" data-k="super">Super</button>
        <button class="cancel hidden" id="bCancel" data-k="cancel">Cancel card</button>
      </div>
      <h3>Board <span id="boardHint" style="text-transform:none;letter-spacing:0"></span></h3>
      <div class="board" id="board"></div>
      <div class="legend" id="legend"></div>
      <h3>Your action cards</h3>
      <div class="hand" id="hand"></div>
    </div>
    <div class="foot"><span id="seatLbl"></span><button id="leave">Pick another colour</button></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const COLORS = ['#3fa9ff', '#ff5a4f', '#45d483', '#ffc23d'], COLOR_NAMES = ['Blue', 'Red', 'Green', 'Gold'];
const N = 6, HQ_POS = [[5, 0], [0, 5], [0, 0], [5, 5]];
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode */ } } };
let myId = store.get('ea-id');
if (!myId) { myId = Math.random().toString(36).slice(2) + Date.now().toString(36); store.set('ea-id', myId); }
const MIRROR = new URLSearchParams(location.search).has('mirror');
let seat = null, es = null, state = null, busy = false, wasMyTurn = false, wasOver = false;
const ICON = { house: '🏠', shop: '🏪', tower: '🏢', ruin: '🏚️' };
const OBS = { mountain: '⛰️', lake: '🌊', crystal: '🔮', wall: '🧱' };

// Small synthesised sounds on the phone itself (the PC plays the full soundtrack).
let actx = null;
function sfx(notes, type = 'triangle', vol = .07) {
  if (MIRROR) return;
  try {
    actx ??= new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    notes.forEach(([f, at, dur]) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + at;
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02);
    });
  } catch { /* audio is optional */ }
}
const buzz = (p) => { if (MIRROR) return; try { navigator.vibrate?.(p); } catch { /* optional */ } };
document.addEventListener('click', (e) => { if (e.target.closest('button:not(:disabled)')) sfx([[1100, 0, .04]], 'square', .03); }, true);

function setSeatColor(s) { document.body.style.setProperty('--me', COLORS[s] || COLORS[0]); }
async function refreshSeats() {
  const box = $('seatBtns'); box.innerHTML = '';
  let info = { seats: [] };
  try { info = await (await fetch('/info')).json(); } catch { $('joinNote').textContent = 'Cannot reach the PC. Are you on the same Wi-Fi?'; }
  COLORS.forEach((c, i) => {
    const s = info.seats[i] || {}, b = document.createElement('button');
    b.className = 'seatbtn'; b.style.background = c; b.dataset.seat = i;
    b.disabled = s.online && store.get('ea-seat') !== String(i);
    b.textContent = `${COLOR_NAMES[i]}${b.disabled ? ' (taken)' : ''}`;
    b.onclick = () => join(i); box.append(b);
  });
}
function join(s) {
  seat = s; store.set('ea-seat', String(s)); setSeatColor(s);
  es?.close();
  es = new EventSource(`/events?role=player&seat=${s}&id=${encodeURIComponent(myId)}`);
  es.addEventListener('joined', () => { $('join').classList.add('hidden'); $('game').classList.remove('hidden'); $('conn').classList.add('hidden'); });
  es.addEventListener('state', (e) => { state = JSON.parse(e.data); busy = false; render(); });
  es.addEventListener('taken', () => { es.close(); showJoin('That colour is already taken by another phone.'); });
  es.addEventListener('kicked', () => { es.close(); store.set('ea-seat', ''); showJoin('The seats were freed on the PC. Pick again.'); });
  es.onerror = () => { if (!$('game').classList.contains('hidden')) $('conn').classList.remove('hidden'); };
  $('seatLbl').textContent = `${COLOR_NAMES[s]} seat`;
}
function showJoin(note) {
  seat = null; $('game').classList.add('hidden'); $('join').classList.remove('hidden');
  $('joinNote').textContent = note || ''; refreshSeats();
}
async function cmd(a, extra = {}) {
  if (busy || seat == null) return;
  busy = true; render();
  try { await fetch('/cmd', { method: 'POST', body: JSON.stringify({ ...extra, seat, id: myId, a }) }); } catch { busy = false; render(); }
  setTimeout(() => { if (busy) { busy = false; render(); } }, 2500); // never lock the buttons if the PC ignores a tap
}

// Rotate the grid so that this player's HQ is always bottom-left.
function displayIndex(r, c) {
  const [hr, hc] = HQ_POS[seat] || HQ_POS[0];
  let rr = r, cc = c;
  if (hr === 0 && hc === 0) [rr, cc] = [N - 1 - c, r];        // top-left: rotate counter-clockwise
  else if (hr === 0) [rr, cc] = [N - 1 - r, N - 1 - c];       // top-right: rotate 180°
  else if (hc === N - 1) [rr, cc] = [c, N - 1 - r];           // bottom-right: rotate clockwise
  return rr * N + cc;
}

function render() {
  const s = state; if (!s) return;
  $('heroPick').classList.toggle('hidden', !s.lobby); $('ingame').classList.toggle('hidden', !!s.lobby);
  if (s.lobby) {
    const mine = s.chars?.[seat];
    $('me').textContent = `${COLOR_NAMES[seat]} player`; $('turn').className = 'turn';
    $('turn').textContent = mine ? 'Ready! Waiting for the PC to start…' : 'Choose your hero below';
    $('heroLine').textContent = ''; $('result').classList.add('hidden'); $('dom').innerHTML = ''; $('rivals').innerHTML = '';
    const box = $('heroes'); box.innerHTML = '';
    for (const h of s.heroes || []) {
      const takenBy = (s.chars || []).findIndex((x, i) => x === h.id && i !== seat);
      const b = document.createElement('button');
      b.className = 'hero' + (h.id === mine ? ' sel' : ''); b.style.setProperty('--hc', h.color);
      b.disabled = takenBy >= 0; b.dataset.k = 'hero:' + h.id;
      b.innerHTML = `<span class="hi">${h.icon}</span><span class="hn">${h.name} <small>· ${h.title}${takenBy >= 0 ? ` · taken by ${COLOR_NAMES[takenBy]}` : ''}</small></span>
        <span class="hp"><b>Passive:</b> ${h.passive}</span><span class="hs"><b>${h.superIcon} ${h.superName} (1×):</b> ${h.superText}</span>`;
      b.onclick = () => { sfx([[523, 0, .2], [784, .08, .3]]); buzz(30); cmd('char', { hero: h.id }); };
      box.append(b);
    }
    return;
  }
  $('me').textContent = `${s.hero.icon} ${s.name}`; $('status').textContent = s.status || '';
  document.body.style.setProperty('--hc', s.hero.color);
  $('heroLine').textContent = `Passive: ${s.hero.passive}`;
  $('time').textContent = `${Math.floor(s.timeLeft / 60)}:${String(s.timeLeft % 60).padStart(2, '0')}`;
  $('time').classList.toggle('low', s.timeLeft < 60);
  $('dom').innerHTML = s.players.map((p) => `<div style="width:${p.dom}%;background:${COLORS[p.slot]}"></div>`).join('');
  $('rivals').innerHTML = s.players.map((p) => `<span class="${p.alive ? '' : 'out'}" style="color:${COLORS[p.slot]};border-color:${COLORS[p.slot]}">${p.icon} ${p.dom}% · 💎${p.beacons}</span>`).join('');
  const turn = $('turn');
  turn.className = 'turn' + (s.myTurn ? ' mine' : '');
  turn.textContent = s.over ? 'Round over' : !s.alive ? 'You were eliminated 💀' : s.myTurn ? 'Your turn!' : `${s.curName}'s turn`;
  if (s.myTurn && !wasMyTurn) { buzz([80, 60, 80]); sfx([[660, 0, .18], [990, .1, .3]], 'sine'); }
  wasMyTurn = s.myTurn;
  if (s.over && !wasOver) { const won = s.result?.winner === seat; sfx(won ? [[523, 0, .3], [659, .14, .3], [784, .28, .3], [1047, .42, .6]] : [[392, 0, .4], [330, .2, .4], [262, .4, .6]]); buzz(won ? [60, 40, 60, 40, 200] : 300); }
  wasOver = s.over;
  $('msg').textContent = s.msg || '';
  $('card').textContent = s.card ? s.card.label : '?'; $('card').classList.toggle('red', !!s.card?.red);
  $('tokens').innerHTML = `${s.tokens ? '★'.repeat(Math.min(s.tokens, 6)) : 0}<small>${s.phase === 'claim' && s.myTurn ? `${s.claims} to claim` : 'claims'}</small>`;
  $('peek').textContent = s.peek ? (MIRROR ? '🔭 Secretly peeking at the next card…' : `🔭 Next card: ${s.peek}`) : '';
  $('bLower').disabled = $('bHigher').disabled = busy || !s.canGuess;
  $('bCash').disabled = busy || !s.canCash;
  $('bCash').textContent = s.myTurn && s.phase === 'claim' ? 'Tap a glowing tile below' : `Claim property (${s.tokens})`;
  $('bSuper').classList.toggle('hidden', s.superUsed || !s.alive);
  $('bSuper').textContent = `${s.hero.superIcon} ${s.hero.superName}: ${s.hero.superText}`;
  $('bSuper').disabled = busy || !s.canSuper;
  $('bCancel').classList.toggle('hidden', !s.canCancel);
  const targeting = s.myTurn && (s.phase === 'claim' || s.phase === 'target');
  $('boardHint').textContent = targeting ? '· tap a glowing tile' : '';
  const me = s.players.find((p) => p.slot === seat) || { beacons: 0 };
  $('legend').textContent = `💎 Beacons: you ${me.beacons}/${s.beaconsNeeded} · ${s.canAttack ? 'rival HQ shields are DOWN for you' : `HQ shields drop at ${s.beaconsNeeded}`}`;

  const cells = new Array(N * N);
  s.tiles.forEach((t, i) => { cells[displayIndex(i / N | 0, i % N)] = i; });
  const board = $('board'); board.innerHTML = '';
  for (const i of cells) {
    const t = s.tiles[i], b = document.createElement('button');
    b.className = `tile${t.k === 'obstacle' ? ' obs' : ''}${t.t ? ' t' : ''}`;
    if (t.o >= 0) b.style.background = `color-mix(in srgb, ${COLORS[t.o]} 55%, #10131c)`;
    const icon = t.k === 'obstacle' ? OBS[t.ob] : t.k === 'hq' ? '🏰' : t.k === 'beacon' ? '💎' : ICON[t.b];
    const marks = [t.s ? '🛡️' : '', t.f ? '🏰' : '', t.tr ? '🕸️' : ''].join('');
    b.innerHTML = `${icon}${t.k === 'obstacle' ? '' : `<span class="v">${t.v}</span>`}${marks ? `<span class="mk">${marks}</span>` : ''}`;
    b.dataset.k = 'tile:' + i; b.disabled = busy || !t.t;
    if (t.t) b.onclick = () => cmd('tile', { i });
    board.append(b);
  }

  const hand = $('hand'); hand.innerHTML = '';
  s.hand.forEach((c, idx) => {
    const b = document.createElement('button'); b.className = 'hcard' + (MIRROR ? ' back' : ''); b.dataset.k = 'hand:' + idx;
    // The mirror on the shared screen never reveals the hand to the rivals.
    b.innerHTML = MIRROR ? '<span class="ic">🂠</span><b>Action card</b><small>Secret</small>' : `<span class="ic">${c.icon}</span><b>${c.name}</b><small>${c.text}</small>`;
    b.disabled = busy || !c.playable;
    b.onclick = () => cmd('play', { idx });
    hand.append(b);
  });
  if (!s.hand.length) hand.innerHTML = '<div class="empty">No action cards yet. They are hidden in the deck.</div>';

  const res = $('result');
  res.classList.toggle('hidden', !s.over);
  if (s.over && s.result) {
    const win = s.result.winner === seat, color = s.result.winner < 0 ? '#fff' : COLORS[s.result.winner];
    res.innerHTML = `<h2 style="color:${color}">${s.result.winner < 0 ? 'Draw' : win ? 'You win! 🏆' : s.result.title}</h2><div>${s.result.why}</div><button id="again" data-k="again">Play again</button>`;
    $('again').onclick = () => cmd('restart');
  }
}

$('bHigher').onclick = () => cmd('guess', { dir: 'higher' });
$('bLower').onclick = () => cmd('guess', { dir: 'lower' });
$('bCash').onclick = () => cmd('cash');
$('bCancel').onclick = () => cmd('cancel');
$('bSuper').onclick = () => { buzz([40, 30, 120]); cmd('super'); };
$('leave').onclick = async () => {
  try { await fetch('/leave', { method: 'POST', body: JSON.stringify({ seat, id: myId }) }); } catch { /* server gone */ }
  es?.close(); store.set('ea-seat', ''); showJoin();
};

// Report every touch to the PC so the picture-in-picture mirror can show where the player taps.
let lastTouch = 0;
document.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('[data-k]'); if (!el || seat == null || MIRROR) return;
  const now = Date.now(); if (now - lastTouch < 60) return; lastTouch = now;
  fetch('/cmd', { method: 'POST', body: JSON.stringify({ seat, id: myId, a: 'touch', k: el.dataset.k }) }).catch(() => {});
}, true);
function showTouch(k) {
  const el = document.querySelector(`[data-k="${CSS.escape(k)}"]`); if (!el) return;
  el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  setTimeout(() => {
    const r = el.getBoundingClientRect(), dot = document.createElement('div');
    dot.className = 'tap'; dot.style.left = r.left + r.width / 2 + scrollX + 'px'; dot.style.top = r.top + r.height / 2 + scrollY + 'px';
    document.body.append(dot); setTimeout(() => dot.remove(), 750);
    const fresh = document.querySelector(`[data-k="${CSS.escape(k)}"]`);
    fresh?.classList.add('pressed'); setTimeout(() => fresh?.classList.remove('pressed'), 260);
  }, 120);
}

if (MIRROR) {
  document.body.classList.add('mirror');
  $('join').classList.add('hidden'); $('game').classList.remove('hidden');
  addEventListener('message', (e) => {
    if (e.origin !== location.origin) return;
    const m = e.data || {};
    if (m.type === 'state') { seat = m.seat; setSeatColor(seat); state = m.state; render(); }
    else if (m.type === 'touch') showTouch(m.k);
  });
} else {
  const saved = store.get('ea-seat');
  if (/^[0-3]$/.test(saved || '')) join(+saved); else showJoin();
}
</script>
</body>
</html>
